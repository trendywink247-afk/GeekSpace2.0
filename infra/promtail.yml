server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      # Parse Docker json-file log format
      - docker: {}

      # Parse Pino JSON output from GeekSpace services
      - json:
          expressions:
            level: level
            msg: msg
            module: module
            timestamp: time

      # Map parsed fields to labels
      - labels:
          level:
          module:

      # Extract container_name from Docker labels
      - regex:
          source: filename
          expression: '/var/lib/docker/containers/(?P<container_id>[^/]+)/.*'

      - labels:
          container_id:
