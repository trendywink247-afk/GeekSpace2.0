apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: GET
      manageAlerts: true
      prometheusType: Prometheus
      cacheLevel: 'High'

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"([a-z0-9]+)"'
          url: ''
        - name: Level
          matcherRegex: '"level":"([a-z]+)"'
          url: ''