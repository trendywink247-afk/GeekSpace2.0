global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'geekspace-app'
    static_configs:
      - targets: ['geekspace:3001']
    metrics_path: '/metrics'

  - job_name: 'geekspace-staging'
    static_configs:
      - targets: ['staging:3001']
    metrics_path: '/metrics'
    scrape_interval: 30s
