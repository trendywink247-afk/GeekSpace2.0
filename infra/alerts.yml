groups:
  - name: agentin-alerts
    interval: 30s
    rules:
      - alert: HighMemoryUsage
        expr: (1 - (machine_memory_bytes - container_memory_usage_bytes{name=""}) / machine_memory_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage ({{ $value }}%)"

      - alert: ContainerDown
        expr: up{job="cadvisor"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Container monitoring (cAdvisor) is down"

      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{name=~"geekspace-app|geekspace-staging|ollama.*"}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} CPU above 80%"

      - alert: ContainerHighMemory
        expr: container_memory_usage_bytes{name=~"geekspace-app|geekspace-staging"} / container_spec_memory_limit_bytes * 100 > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} memory above 90% of limit"

  - name: agentin-app-alerts
    interval: 30s
    rules:
      # High 5xx error rate from the app
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate on {{ $labels.job }} ({{ $value | humanize }}/s)"
          description: "Job {{ $labels.job }} is returning 5xx errors at {{ $value | humanize }} req/s. Investigate app logs."

      # P95 latency above 2 seconds
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "P95 latency above 2s on {{ $labels.job }} ({{ $value | humanizeDuration }})"
          description: "95th-percentile response time for {{ $labels.job }} has exceeded 2 seconds."

      # Any scraped target is down (geekspace-app, geekspace-staging, node-exporter, etc.)
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.instance }} (job={{ $labels.job }}) is down"
          description: "Prometheus cannot reach {{ $labels.instance }}. Check the container/service."

      # Process-level resident memory above 1 GB (app container)
      - alert: AppHighMemoryRSS
        expr: process_resident_memory_bytes{job=~"geekspace-app|geekspace-staging"} > 1e9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "App process RSS above 1 GB on {{ $labels.job }} ({{ $value | humanize1024 }}B)"
          description: "The Node.js process in {{ $labels.job }} is holding more than 1 GB of resident memory."

      # Root filesystem free space below 15%
      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space on / is below 15% ({{ $value | humanizePercentage }} free)"
          description: "Available disk space on {{ $labels.instance }} root filesystem has dropped below 15%. Free up space immediately."
