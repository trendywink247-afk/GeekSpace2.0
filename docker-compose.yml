# NOTE: Ollama and Moonshot containers are managed externally by Hostinger.
# They are NOT part of this compose file. GeekSpace connects to them via
# the geekspace-shared network using their container names.

services:
#-----caddy------------
  caddy:
    image: caddy:2
    container_name: geekspace-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/www/geekspace:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - geekspace-net
    depends_on:
      - geekspace
  # ---- GeekSpace API + Frontend ----
  geekspace:
    build: .
    container_name: geekspace-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/geekspace.db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-geekspace-redis-2026}@redis:6379
      # Set to your actual Ollama container name/address
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b}
      - EDITH_GATEWAY_URL=${EDITH_GATEWAY_URL:-http://edith-bridge:8787}
      - EDITH_TOKEN=${EDITH_TOKEN:-}
      - PICOCLAW_URL=${PICOCLAW_URL:-http://picoclaw:8080}
      - PICOCLAW_ENABLED=${PICOCLAW_ENABLED:-true}
      - BRIDGE_ENABLED=${BRIDGE_ENABLED:-true}
      - BRIDGE_AUTO_ESCALATE=${BRIDGE_AUTO_ESCALATE:-true}
      - BRIDGE_MAX_WORKFLOW_STEPS=${BRIDGE_MAX_WORKFLOW_STEPS:-6}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - geekspace-data:/app/data
      - apm-data:/app/apminsightdata
    networks:
      - geekspace-net
      - geekspace-shared
    depends_on:
      redis:
        condition: service_healthy
      picoclaw:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G  # Increased from 512M for AI peak load resilience
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # [LEGACY] EDITH Bridge (WS-RPC → HTTP for Moonshot) — deprecated, kept for reference
  edith-bridge:
    build: ./bridge/edith-bridge
    container_name: geekspace-edith-bridge
    restart: unless-stopped
    profiles: ["edith"]
    environment:
      # Set to your actual Moonshot container name/address
      - EDITH_OPENCLAW_WS=${EDITH_OPENCLAW_WS:-ws://openclaw:55550}
      - EDITH_TOKEN=${EDITH_TOKEN:-}
      - OPENCLAW_CHAT_METHOD=${OPENCLAW_CHAT_METHOD:-chat.completions}
      - BRIDGE_PORT=8787
      - REQUEST_TIMEOUT_MS=120000
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - geekspace-net
      - geekspace-shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: geekspace-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-geekspace-redis-2026}
    volumes:
      - redis-data:/data
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---- Weebo Engine (PicoClaw — fast AI triage sidecar) ----
  picoclaw:
    build: ./picoclaw
    container_name: geekspace-picoclaw
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - OLLAMA_BASE_URL=${PICOCLAW_OLLAMA_URL:-http://ollama-qtzz-ollama-1:11434}
      - PICOCLAW_PORT=8080
      - PICOCLAW_MODEL=${PICOCLAW_MODEL:-qwen2.5-coder:1.5b}
      - PICOCLAW_TIMEOUT_MS=15000
    networks:
      - geekspace-net
      - geekspace-shared
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---- n8n (Workflow Automation) ----
  n8n:
    image: n8nio/n8n:1.78.1
    container_name: geekspace-n8n
    restart: unless-stopped
    profiles: ["n8n"]
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${TZ:-UTC}
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  geekspace-data:
    driver: local
  apm-data:
    driver: local
  redis-data:
    driver: local
  n8n-data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  geekspace-net:
    driver: bridge
  geekspace-shared:
    external: true
