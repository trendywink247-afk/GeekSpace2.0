volumes:
  geekspace-data:
    driver: local
  apm-data:
    driver: local
  redis-data:
    driver: local
  n8n-data:
    driver: local
  uptime-kuma-data:
    driver: local
  searxng-data:
    driver: local
  meilisearch-data:
    driver: local
  qdrant-data:
    driver: local
  geekspace-staging-data:
    driver: local
  staging-redis-data:
    driver: local
  geekos-postgres-data:
    driver: local

networks:
  geekspace-net:
    driver: bridge
  geekspace-shared:
    external: true
