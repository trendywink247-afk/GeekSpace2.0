# NOTE: Ollama and Moonshot containers are managed externally by Hostinger.
# They are NOT part of this compose file. GeekSpace connects to them via
# the geekspace-shared network using their container names.

services:
  # ---- GeekSpace API + Frontend ----
  geekspace:
    build: .
    container_name: geekspace-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env
    ports:
      - "127.0.0.1:${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/geekspace.db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      # Set to your actual Ollama container name/address
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama-qtzz-ollama-1:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e4b}
      - OLLAMA_COMPLEX_MODEL=${OLLAMA_COMPLEX_MODEL:-gemma4:e4b}
      - OLLAMA_TIMEOUT_MS=90000
      - OLLAMA_MAX_TOKENS=4096
      - OLLAMA_THINKING_ENABLED=true
      # Voice pipeline sidecars
      - KOKORO_TTS_URL=http://kokoro-tts:5101
      - KOKORO_TTS_ENABLED=true
      - PIPER_TTS_URL=http://piper-tts:5100
      - PIPER_TTS_ENABLED=true
      - WHISPER_LOCAL_URL=http://whisper-stt:5102
      - WHISPER_LOCAL_ENABLED=true
      - EDITH_GATEWAY_URL=${EDITH_GATEWAY_URL:-http://edith-bridge:8787}
      - EDITH_TOKEN=${EDITH_TOKEN:-}
      - PICOCLAW_URL=${PICOCLAW_URL:-http://picoclaw:8080}
      - PICOCLAW_ENABLED=${PICOCLAW_ENABLED:-true}
      - PICOCLAW_TIMEOUT_MS=5000
      - BRIDGE_ENABLED=${BRIDGE_ENABLED:-true}
      - BRIDGE_AUTO_ESCALATE=${BRIDGE_AUTO_ESCALATE:-true}
      - BRIDGE_MAX_WORKFLOW_STEPS=${BRIDGE_MAX_WORKFLOW_STEPS:-6}
      - GITHUB_DEV_TOKEN=${GITHUB_DEV_TOKEN:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - geekspace-data:/app/data
      - apm-data:/app/apminsightdata
      # REMOVED: source code bind mount (security risk in production)
      # - /root/GeekSpace2.0:/repo
    networks:
      - geekspace-net
      - geekspace-shared
    depends_on:
      redis:
        condition: service_healthy
      picoclaw:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: geekspace-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---- Weebo Engine (PicoClaw — fast AI triage sidecar) ----
  picoclaw:
    build: ./picoclaw
    container_name: geekspace-picoclaw
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - OLLAMA_BASE_URL=${PICOCLAW_OLLAMA_URL:-http://ollama-qtzz-ollama-1:11434}
      - PICOCLAW_PORT=8080
      - PICOCLAW_MODEL=${PICOCLAW_MODEL:-qwen2.5-coder:3b}
      - PICOCLAW_TIMEOUT_MS=5000
    networks:
      - geekspace-net
      - geekspace-shared
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---- n8n (Workflow Automation) ----
  n8n:
    image: n8nio/n8n:1.78.1
    container_name: geekspace-n8n
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    profiles: ["n8n"]
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${TZ:-UTC}
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ---- Uptime Kuma (Status Monitoring) ----
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: geekspace-uptime-kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    extra_hosts:
      - "ai.agentin.chat:host-gateway"
      - "api.agentin.chat:host-gateway"
      - "status.agentin.chat:host-gateway"
    ports:
      - "127.0.0.1:3100:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ---- SearXNG (Free Metasearch — replaces Tavily) ----
  searxng:
    image: searxng/searxng:2026.3.12-3d3a78f3a
    container_name: geekspace-searxng
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/etc/searxng
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Meilisearch (Typo-tolerant instant search) ----
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: geekspace-meilisearch
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_ENV=production
      - MEILI_MAX_INDEXING_MEMORY=100Mb
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Qdrant (Vector DB for semantic memory search) ----
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: geekspace-qdrant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

#-----browser-agent-----
  browser:
    build: ./browser-agent
    container_name: geekspace-browser
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - BROWSER_SECRET=${BROWSER_SECRET}
      - MAX_CONCURRENT=2
      - PORT=3010
    expose:
      - "3010"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3010/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.0'
    networks:
      - geekspace-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Staging Environment (ai.geekspace.space) ----
  staging:
    build: .
    container_name: geekspace-staging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file: .env.staging
    ports:
      - "127.0.0.1:3002:3001"
    environment:
      - NODE_ENV=staging
      - PORT=3001
      - DB_PATH=/app/data/geekspace.db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@staging-redis:6379
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama-qtzz-ollama-1:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e4b}
      - OLLAMA_COMPLEX_MODEL=${OLLAMA_COMPLEX_MODEL:-gemma4:e4b}
      - OLLAMA_TIMEOUT_MS=90000
      - OLLAMA_MAX_TOKENS=4096
      - PICOCLAW_URL=${PICOCLAW_URL:-http://picoclaw:8080}
      - PICOCLAW_ENABLED=${PICOCLAW_ENABLED:-true}
      - PICOCLAW_TIMEOUT_MS=5000
      - BRIDGE_ENABLED=${BRIDGE_ENABLED:-true}
      - BRIDGE_AUTO_ESCALATE=${BRIDGE_AUTO_ESCALATE:-true}
      - BRIDGE_MAX_WORKFLOW_STEPS=${BRIDGE_MAX_WORKFLOW_STEPS:-6}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - geekspace-staging-data:/app/data
    networks:
      - geekspace-net
      - geekspace-shared
    depends_on:
      staging-redis:
        condition: service_healthy
      picoclaw:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ---- Staging Redis (isolated from prod) ----
  staging-redis:
    image: redis:7-alpine
    container_name: geekspace-staging-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - staging-redis-data:/data
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

  # ---- Kokoro TTS (High-quality neural TTS — ONNX CPU) ----
  kokoro-tts:
    build: ./kokoro-tts
    container_name: geekspace-kokoro-tts
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    expose:
      - "5101"
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5101/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Piper TTS (Fast CPU-friendly TTS fallback) ----
  piper-tts:
    build: ./piper-tts
    container_name: geekspace-piper-tts
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    expose:
      - "5100"
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5100/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- whisper.cpp STT (Local speech-to-text — CPU optimized) ----
  whisper-stt:
    build: ./whisper-stt
    container_name: geekspace-whisper-stt
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    expose:
      - "5102"
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5102/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

