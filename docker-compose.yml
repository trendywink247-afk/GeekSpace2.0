# NOTE: Ollama and Moonshot containers are managed externally by Hostinger.
# They are NOT part of this compose file. GeekSpace connects to them via
# the geekspace-shared network using their container names.

services:
#-----caddy------------
  caddy:
    image: caddy:2
    container_name: geekspace-caddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      - GATE_COOKIE_VALUE=${GATE_COOKIE_VALUE:?Set GATE_COOKIE_VALUE in .env}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/www/geekspace:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - geekspace-net
      - geekspace-shared
    depends_on:
      geekspace:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
  # ---- GeekSpace API + Frontend ----
  geekspace:
    build: .
    container_name: geekspace-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    ports:
      - "127.0.0.1:${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/geekspace.db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      # Set to your actual Ollama container name/address
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama-qtzz-ollama-1:11434}
      - OLLAMA_MODEL=hermes3:8b
      - OLLAMA_TIMEOUT_MS=20000
      - EDITH_GATEWAY_URL=${EDITH_GATEWAY_URL:-http://edith-bridge:8787}
      - EDITH_TOKEN=${EDITH_TOKEN:-}
      - PICOCLAW_URL=${PICOCLAW_URL:-http://picoclaw:8080}
      - PICOCLAW_ENABLED=${PICOCLAW_ENABLED:-true}
      - PICOCLAW_TIMEOUT_MS=5000
      - BRIDGE_ENABLED=${BRIDGE_ENABLED:-true}
      - BRIDGE_AUTO_ESCALATE=${BRIDGE_AUTO_ESCALATE:-true}
      - BRIDGE_MAX_WORKFLOW_STEPS=${BRIDGE_MAX_WORKFLOW_STEPS:-6}
      - GITHUB_DEV_TOKEN=${GITHUB_DEV_TOKEN:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - geekspace-data:/app/data
      - apm-data:/app/apminsightdata
      # REMOVED: source code bind mount (security risk in production)
      # - /root/GeekSpace2.0:/repo
    networks:
      - geekspace-net
      - geekspace-shared
    depends_on:
      redis:
        condition: service_healthy
      picoclaw:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # [LEGACY] EDITH Bridge (WS-RPC → HTTP for Moonshot) — deprecated, kept for reference
  edith-bridge:
    build: ./bridge/edith-bridge
    container_name: geekspace-edith-bridge
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles: ["edith"]
    environment:
      # Set to your actual Moonshot container name/address
      - EDITH_OPENCLAW_WS=${EDITH_OPENCLAW_WS:-ws://openclaw:55550}
      - EDITH_TOKEN=${EDITH_TOKEN:-}
      - OPENCLAW_CHAT_METHOD=${OPENCLAW_CHAT_METHOD:-chat.completions}
      - BRIDGE_PORT=8787
      - REQUEST_TIMEOUT_MS=120000
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - geekspace-net
      - geekspace-shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: geekspace-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---- Weebo Engine (PicoClaw — fast AI triage sidecar) ----
  picoclaw:
    build: ./picoclaw
    container_name: geekspace-picoclaw
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - OLLAMA_BASE_URL=${PICOCLAW_OLLAMA_URL:-http://ollama-qtzz-ollama-1:11434}
      - PICOCLAW_PORT=8080
      - PICOCLAW_MODEL=qwen2.5-coder:1.5b
      - PICOCLAW_TIMEOUT_MS=5000
    networks:
      - geekspace-net
      - geekspace-shared
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ---- n8n (Workflow Automation) ----
  n8n:
    image: n8nio/n8n:1.78.1
    container_name: geekspace-n8n
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles: ["n8n"]
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${TZ:-UTC}
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ---- Uptime Kuma (Status Monitoring) ----
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: geekspace-uptime-kuma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:3100:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ---- SearXNG (Free Metasearch — replaces Tavily) ----
  searxng:
    image: searxng/searxng:2026.3.12-3d3a78f3a
    container_name: geekspace-searxng
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-data:/etc/searxng
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Meilisearch (Typo-tolerant instant search) ----
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: geekspace-meilisearch
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_ENV=production
      - MEILI_MAX_INDEXING_MEMORY=100Mb
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Qdrant (Vector DB for semantic memory search) ----
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: geekspace-qdrant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

#-----browser-agent-----
  browser:
    build: ./browser-agent
    container_name: geekspace-browser
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - BROWSER_SECRET=${BROWSER_SECRET}
      - MAX_CONCURRENT=2
      - PORT=3010
    expose:
      - "3010"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3010/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: '1.0'
    networks:
      - geekspace-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Staging Environment (ai.geekspace.space) ----
  staging:
    build: .
    container_name: geekspace-staging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env.staging
    ports:
      - "127.0.0.1:3002:3001"
    environment:
      - NODE_ENV=staging
      - PORT=3001
      - DB_PATH=/app/data/geekspace.db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@staging-redis:6379
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama-qtzz-ollama-1:11434}
      - OLLAMA_MODEL=hermes3:8b
      - OLLAMA_TIMEOUT_MS=20000
      - PICOCLAW_URL=${PICOCLAW_URL:-http://picoclaw:8080}
      - PICOCLAW_ENABLED=${PICOCLAW_ENABLED:-true}
      - PICOCLAW_TIMEOUT_MS=5000
      - BRIDGE_ENABLED=${BRIDGE_ENABLED:-true}
      - BRIDGE_AUTO_ESCALATE=${BRIDGE_AUTO_ESCALATE:-true}
      - BRIDGE_MAX_WORKFLOW_STEPS=${BRIDGE_MAX_WORKFLOW_STEPS:-6}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - geekspace-staging-data:/app/data
    networks:
      - geekspace-net
      - geekspace-shared
    depends_on:
      staging-redis:
        condition: service_healthy
      picoclaw:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ---- Staging Redis (isolated from prod) ----
  staging-redis:
    image: redis:7-alpine
    container_name: geekspace-staging-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - staging-redis-data:/data
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'

#-----geekos-agents-----
  geekos-postgres:
    image: pgvector/pgvector:pg16
    container_name: geekspace-geekos-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles:
      - geekos
    environment:
      - POSTGRES_USER=geekos
      - POSTGRES_PASSWORD=${GEEKOS_PG_PASSWORD}
      - POSTGRES_DB=geekos
    volumes:
      - geekos-postgres-data:/var/lib/postgresql/data
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geekos"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  geekos:
    build: ./geekos
    container_name: geekspace-geekos
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    profiles:
      - geekos
    depends_on:
      geekspace:
        condition: service_healthy
      geekos-postgres:
        condition: service_healthy
    environment:
      - OPENAI_API_KEY=agentin-internal-proxy
      - OPENAI_BASE_URL=http://geekspace:3001/api/geekos-llm/v1
      - SMALL_MODEL=agentin-default
      - MEDIUM_MODEL=agentin-default
      - LARGE_MODEL=agentin-default
      - POSTGRES_URL=postgresql://geekos:${GEEKOS_PG_PASSWORD}@geekos-postgres:5432/geekos
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1.0'
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/agents || exit 1"]
      interval: 30s
      timeout: 30s
      start_period: 60s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  geekspace-data:
    driver: local
  apm-data:
    driver: local
  redis-data:
    driver: local
  n8n-data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  uptime-kuma-data:
    driver: local
  searxng-data:
    driver: local
  meilisearch-data:
    driver: local
  qdrant-data:
    driver: local
  geekspace-staging-data:
    driver: local
  staging-redis-data:
    driver: local
  geekos-postgres-data:
    driver: local

networks:
  geekspace-net:
    driver: bridge
  geekspace-shared:
    external: true
