# docker-compose.staging.yml — Staging environment for staging.agentin.chat
# Usage: docker compose -f docker-compose.staging.yml up -d --build
#
# Shares: Caddy (routes via geekspace-net), PicoClaw, Ollama, OpenClaw, Edith Bridge
# Isolates: staging app container, staging Redis, staging DB volume

services:
  staging-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: "${GIT_SHA:-staging}"
    container_name: geekspace-staging-app
    restart: unless-stopped
    env_file: .env.staging
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=/app/data/geekspace.db
      - REDIS_URL=redis://:${STAGING_REDIS_PASSWORD}@staging-redis:6379
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama-qtzz-ollama-1:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - PICOCLAW_URL=${PICOCLAW_URL:-http://picoclaw:8080}
      - PICOCLAW_ENABLED=${PICOCLAW_ENABLED:-true}
      - BRIDGE_ENABLED=${BRIDGE_ENABLED:-true}
      - BRIDGE_AUTO_ESCALATE=${BRIDGE_AUTO_ESCALATE:-true}
      - BRIDGE_MAX_WORKFLOW_STEPS=${BRIDGE_MAX_WORKFLOW_STEPS:-6}
      - EDITH_GATEWAY_URL=${EDITH_GATEWAY_URL:-http://edith-bridge:8787}
      - EDITH_TOKEN=${EDITH_TOKEN:-}
      - GATE_COOKIE_VALUE=${GATE_COOKIE_VALUE:-}
      - GATE_PASSWORD_HASH=${GATE_PASSWORD_HASH:-}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - geekspace-staging-data:/app/data
    networks:
      geekspace-net:
        aliases:
          - staging-app
      geekspace-shared:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"
    depends_on:
      staging-redis:
        condition: service_healthy

  staging-redis:
    image: redis:7-alpine
    container_name: geekspace-staging-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru --requirepass ${STAGING_REDIS_PASSWORD}
    volumes:
      - staging-redis-data:/data
    networks:
      - geekspace-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${STAGING_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "3"

volumes:
  geekspace-staging-data:
    driver: local
  staging-redis-data:
    driver: local

networks:
  geekspace-net:
    external: true
    name: geekspace20_geekspace-net
  geekspace-shared:
    external: true
