<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#030304;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#E8E8F0}
.gate{text-align:center;padding:2rem}
h1{font-size:1.5rem;font-weight:600;margin-bottom:.5rem;background:linear-gradient(135deg,#00FFD4,#00D4B0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{font-size:.875rem;color:#6B7280;margin-bottom:2rem}
form{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
input{padding:.75rem 1rem;border-radius:.5rem;border:1px solid rgba(0,255,212,0.2);background:#0A0A0F;color:#E8E8F0;font-size:1rem;width:260px;outline:none;transition:border-color .2s}
input:focus{border-color:#00FFD4}
button{padding:.75rem 1.5rem;border-radius:.5rem;border:none;background:#00FFD4;color:#030304;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s}
button:hover{background:#00D4B0}
button:disabled{opacity:.5;cursor:not-allowed}
.err{color:#FF3366;font-size:.875rem;margin-top:1rem;display:none}
</style>
</head>
<body>
<div class="gate">
<h1>Agentin</h1>
<p>Enter password to continue</p>
<form id="f">
<input type="password" id="pw" placeholder="Password" autofocus autocomplete="current-password">
<button type="submit" id="btn">Enter</button>
</form>
<div class="err" id="err">Wrong password</div>
</div>
<script>
document.getElementById('f').addEventListener('submit', async function(e) {
  e.preventDefault();
  var pw = document.getElementById('pw').value;
  var btn = document.getElementById('btn');
  var err = document.getElementById('err');
  if (!pw) return;
  btn.disabled = true;
  err.style.display = 'none';
  try {
    var res = await fetch('/api/gate-verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    if (res.ok) {
      window.location.href = '/';
    } else {
      err.style.display = 'block';
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }
  } catch (_) {
    err.textContent = 'Connection error';
    err.style.display = 'block';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
