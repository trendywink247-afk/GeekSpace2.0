# ================================================================
# WEBHOOKS (OpenAPI 3.1 webhooks section)
# ================================================================
webhooks:
  telegramUpdate:
    post:
      operationId: telegramWebhookEvent
      summary: Telegram Bot API update
      description: |
        Telegram sends updates to `/api/webhooks/telegram` when users message
        the bot. Verified via `X-Telegram-Bot-Api-Secret-Token` header matching
        the configured `TELEGRAM_WEBHOOK_SECRET` env var.

        **Verification**: Compare `X-Telegram-Bot-Api-Secret-Token` header.
        **Idempotency**: Telegram may retry on timeout; use `update_id` for dedup.
        **Retry**: Telegram retries if no 200 response within ~60s.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramUpdate"
      responses:
        "200":
          description: Acknowledged

  stripeEvent:
    post:
      operationId: stripeWebhookEvent
      summary: Stripe payment webhook
      description: |
        Stripe sends events (checkout.session.completed, etc.) to
        `/api/billing/webhook`. Request body must be parsed as raw bytes
        for signature verification.

        **Verification**: `Stripe-Signature` header + `stripe.webhooks.constructEvent()`.
        **Idempotency**: Stripe includes an `id` field; store processed event IDs.
        **Retry**: Stripe retries with exponential backoff for 72 hours on non-2xx.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                type:
                  type: string
                data:
                  type: object
      responses:
        "200":
          description: Event processed

  razorpayEvent:
    post:
      operationId: razorpayWebhookEvent
      summary: Razorpay payment webhook
      description: |
        Razorpay sends payment events to `/api/billing/razorpay/webhook`.
        Verified via HMAC-SHA256 signature in `X-Razorpay-Signature` header
        using the webhook secret.

        **Verification**: HMAC-SHA256 of raw body with Razorpay webhook secret.
        **Idempotency**: Use `event.id` for dedup; Razorpay may send duplicates.
        **Retry**: Razorpay retries up to 24 hours on failure.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                payload:
                  type: object
      responses:
        "200":
          description: Event processed

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token from /auth/login or /auth/signup
    adminAuth:
      type: http
      scheme: bearer
      description: Admin token (ADMIN_TOKEN env var) for admin-only endpoints

  responses:
    ValidationError:
      description: Request body failed Zod schema validation
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Validation failed
              details:
                type: array
                items:
                  type: object
                  properties:
                    path:
                      type: string
                    message:
                      type: string

    UnauthorizedError:
      description: Missing or invalid JWT bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    RateLimitError:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit window resets
        RateLimit-Limit:
          schema:
            type: integer
        RateLimit-Remaining:
          schema:
            type: integer
        RateLimit-Reset:
          schema:
            type: integer
          description: Unix epoch seconds when the window resets
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Too many requests. Please slow down.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: Machine-readable error code
          enum:
            - NOT_FOUND
            - UNAUTHORIZED
            - QUOTA_EXCEEDED
            - VALIDATION_ERROR
            - PAYMENT_REQUIRED

    SignupRequest:
      type: object
      required: [email, password, username]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 8
          maxLength: 128
        username:
          type: string
          minLength: 2
          maxLength: 30
          pattern: "^[a-zA-Z0-9_-]+$"
        name:
          type: string
          maxLength: 100
        invite_code:
          type: string
          description: Required when INVITE_REQUIRED=true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 128

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: Opaque refresh token (login only)

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        name:
          type: string
        avatar:
          type: string
          nullable: true
        bio:
          type: string
        location:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        role:
          type: string
          nullable: true
        company:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        theme:
          type: object
          properties:
            mode:
              type: string
              enum: [dark, light]
            accentColor:
              type: string
        plan:
          type: string
          enum: [free, pilot, intro, halfyear, yearly]
        credits:
          type: integer
        timezone:
          type: string
        notifications:
          type: object
          properties:
            email:
              type: boolean
            push:
              type: boolean
            agentUpdates:
              type: boolean
            reminders:
              type: boolean
            weeklyDigest:
              type: boolean
            proactiveEnabled:
              type: boolean
        privacy:
          type: object
          properties:
            showProfile:
              type: boolean
            showActivity:
              type: boolean
            allowAgentChat:
              type: boolean
            showLocation:
              type: boolean
        createdAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        username:
          type: string
        bio:
          type: string
        avatar:
          type: string
        location:
          type: string
        website:
          type: string
        role:
          type: string
        company:
          type: string
        tags:
          type: array
          items:
            type: string
        theme:
          type: object
          properties:
            mode:
              type: string
            accentColor:
              type: string
        notifications:
          type: object
          properties:
            email:
              type: boolean
            push:
              type: boolean
            agentUpdates:
              type: boolean
            reminders:
              type: boolean
            weeklyDigest:
              type: boolean
            proactiveEnabled:
              type: boolean
        privacy:
          type: object
          properties:
            showProfile:
              type: boolean
            showActivity:
              type: boolean
            allowAgentChat:
              type: boolean
            showLocation:
              type: boolean

    ChatRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
        messageCount:
          type: integer
          minimum: 0
        channel:
          type: string
          maxLength: 50
        context:
          type: string
          maxLength: 50
        existingArtifactId:
          type: string
          format: uuid
        history:
          type: array
          maxItems: 20
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
                maxLength: 4000

    ChatResponse:
      type: object
      properties:
        reply:
          type: string
        provider:
          type: string
        model:
          type: string
        creditsUsed:
          type: number
        intent:
          type: string
        actions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              result:
                type: object
        rateLimitStatus:
          type: object
          properties:
            remaining:
              type: integer
            limit:
              type: integer
            windowMinutes:
              type: integer

    AgentConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        displayName:
          type: string
        mode:
          type: string
          enum: [builder, assistant, creative, analyst]
        voice:
          type: string
        systemPrompt:
          type: string
        personality:
          type: string
        primaryModel:
          type: string
        status:
          type: string

    Memory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        category:
          type: string
        key:
          type: string
        value:
          type: string
        confidence:
          type: number
        source:
          type: string
        accessCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        summary:
          type: string
          nullable: true
        tags:
          type: string
          nullable: true
        starred:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Reminder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        text:
          type: string
        datetime:
          type: string
        channel:
          type: string
          enum: [telegram, email, push]
        category:
          type: string
          enum: [personal, work, health, finance, general, other]
        recurring:
          type: string
        recurrence:
          type: string
          nullable: true
        completed:
          type: boolean
        priority:
          type: string
          enum: [low, normal, high, urgent]
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time

    ReminderCreate:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        datetime:
          type: string
          description: ISO 8601 datetime
        channel:
          type: string
          enum: [telegram, email, push]
          default: push
        category:
          type: string
          enum: [personal, work, health, other, general]
          default: personal
        recurring:
          type: string
          enum: ["", daily, weekly, monthly]
        recurrence:
          type: string
          nullable: true
        priority:
          type: string
          enum: [low, normal, high, urgent]
          default: normal

    Automation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        triggerType:
          type: string
          enum: [time, event, webhook, manual, keyword, health_down]
        triggerConfig:
          type: object
        actionType:
          type: string
          enum:
            - n8n-webhook
            - telegram-message
            - portfolio-update
            - manychat-broadcast
            - whatsapp-message
            - call_api
            - create_reminder
            - log
        actionConfig:
          type: object
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AutomationCreate:
      type: object
      required: [name, triggerType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        triggerType:
          type: string
          enum: [time, event, webhook, manual, keyword, health_down]
        triggerConfig:
          type: object
        actionType:
          type: string
          enum:
            - n8n-webhook
            - telegram-message
            - portfolio-update
            - manychat-broadcast
            - whatsapp-message
            - call_api
            - create_reminder
            - log
        actionConfig:
          type: object
        enabled:
          type: boolean
          default: true

    Portfolio:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        headline:
          type: string
        bio:
          type: string
        skills:
          type: array
          items:
            type: object
        projects:
          type: array
          items:
            type: object
        milestones:
          type: array
          items:
            type: object
        social:
          type: object
        visibility:
          type: object
        agentEnabled:
          type: boolean
        isPublic:
          type: boolean
        viewCount:
          type: integer

    Job:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [pending, processing, done, failed]
        result:
          type: object
          nullable: true
          description: Present only when status is "done"
        error:
          type: string
          nullable: true
          description: Present only when status is "failed"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TelegramUpdate:
      type: object
      description: Telegram Bot API Update object
      properties:
        update_id:
          type: integer
        message:
          type: object
          properties:
            message_id:
              type: integer
            chat:
              type: object
              properties:
                id:
                  type: integer
                type:
                  type: string
            from:
              type: object
              properties:
                id:
                  type: integer
                first_name:
                  type: string
                username:
                  type: string
            text:
              type: string
            voice:
              type: object
              nullable: true
        callback_query:
          type: object
          nullable: true
          properties:
            id:
              type: string
            data:
              type: string
