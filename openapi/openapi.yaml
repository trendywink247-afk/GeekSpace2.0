openapi: 3.1.0
info:
  title: Agentin API
  version: "3.2.0"
  description: |
    Production API for the Agentin platform — a personal AI agent with chat,
    reminders, automations, portfolio hosting, voice, billing, and multi-channel
    integrations (Telegram, WhatsApp, n8n).

    ## Authentication
    Most endpoints require a JWT bearer token obtained via `/api/auth/login` or
    `/api/auth/signup`. Admin endpoints require a separate `ADMIN_TOKEN` bearer.

    ## Rate Limiting
    Rate limits are returned via standard `RateLimit-*` headers (RFC draft).
    Exceeding the limit returns `429` with a `Retry-After` header.

    ## Note
    This specification covers the ~50 most important endpoints. The full API
    contains 80+ route files with additional endpoints for analytics, calendar,
    planner, search, office, sandbox, skills, and more.
  contact:
    name: Agentin Engineering
    url: https://agentin.chat
  license:
    name: Proprietary
    url: https://agentin.chat/terms

servers:
  - url: http://localhost:3001/api
    description: Local development
  - url: https://api.agentin.chat/api
    description: Production

tags:
  - name: auth
    description: Authentication, sessions, password reset
  - name: users
    description: User profile and settings
  - name: agent
    description: AI chat, streaming, config, memory, conversations
  - name: billing
    description: Plans, checkout, Stripe/Razorpay webhooks, day passes
  - name: reminders
    description: Reminder CRUD, snoozing, bulk ops, export
  - name: automations
    description: Automation CRUD, triggers, dry-run, dead-letter queue
  - name: portfolio
    description: Public developer portfolio and visitor chat
  - name: integrations
    description: Telegram, WhatsApp, GitHub, n8n channel connections
  - name: webhooks
    description: Inbound webhooks for Telegram, WhatsApp, n8n callbacks
  - name: health
    description: Health checks, readiness probes, live dashboard
  - name: admin
    description: Admin-only platform management (requires ADMIN_TOKEN)
  - name: models
    description: Free LLM model discovery and changelog
  - name: voice
    description: Voice transcription and text-to-speech
  - name: jobs
    description: Async job status polling
  - name: dashboard
    description: User dashboard stats
  - name: usage
    description: Token and credit usage analytics
  - name: outputs
    description: Output generation (PDF, todo, plan, summarize)

security:
  - bearerAuth: []

paths:
  # ================================================================
  # AUTH
  # ================================================================
  /auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: Register a new account
      description: |
        Creates a new user with agent config, portfolio, subscription, and
        default integrations. May require an invite code when INVITE_REQUIRED=true.
      x-rate-limit:
        max: 5
        windowSeconds: 900
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          description: Invite code required or invalid
        "409":
          description: Email or username already taken

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Authenticate with email and password
      description: |
        Returns a JWT access token and a refresh token. Brute-force protected
        with per-IP lockout after 5 failed attempts within 15 minutes.
      x-rate-limit:
        max: 20
        windowSeconds: 900
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          description: Invalid credentials
        "429":
          $ref: "#/components/responses/RateLimitError"

  /auth/demo:
    post:
      tags: [auth]
      operationId: demoLogin
      summary: Log in as the demo user
      description: Seeds demo data (non-production only) and returns a demo JWT.
      x-rate-limit:
        max: 20
        windowSeconds: 900
      security: []
      responses:
        "200":
          description: Demo session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "500":
          description: Demo account setup failed

  /auth/me:
    get:
      tags: [auth]
      operationId: getAuthenticatedUser
      summary: Get the currently authenticated user
      description: Returns the full user profile for the JWT bearer. Cached in Redis (30s TTL).
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: User not found

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Rotate refresh token and issue new access token
      description: |
        Accepts a valid refresh token and returns a new access + refresh token pair.
        The old refresh token is revoked (one-time use). 10 req/15min rate limit.
      x-rate-limit:
        max: 10
        windowSeconds: 900
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New token pair issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  refreshToken:
                    type: string
        "401":
          description: Invalid or expired refresh token

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke all refresh tokens for the user
      responses:
        "200":
          description: Logged out
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Request a password reset OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: OTP sent (or silently accepted if email not found)

  /auth/verify-reset-otp:
    post:
      tags: [auth]
      operationId: verifyResetOtp
      summary: Verify a password reset OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
      responses:
        "200":
          description: OTP valid, returns a reset token
        "400":
          description: Invalid or expired OTP

  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password using a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, newPassword]
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password reset successful
        "400":
          description: Invalid token or weak password

  /auth/sessions:
    get:
      tags: [auth]
      operationId: listSessions
      summary: List active refresh token sessions
      responses:
        "200":
          description: Array of active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    device:
                      type: string
                    maskedIp:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
    delete:
      tags: [auth]
      operationId: revokeAllSessions
      summary: Revoke all refresh token sessions
      responses:
        "200":
          description: All sessions revoked

  /auth/delete-account:
    post:
      tags: [auth]
      operationId: deleteAccount
      summary: Permanently delete the authenticated user's account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "200":
          description: Account deleted
        "401":
          description: Wrong password

  # ================================================================
  # USERS
  # ================================================================
  /users/me:
    get:
      tags: [users]
      operationId: getMyProfile
      summary: Get current user profile
      description: Returns full profile with theme, notifications, and privacy settings. Cached 60s.
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
    patch:
      tags: [users]
      operationId: updateMyProfile
      summary: Update profile fields
      description: Partially updates name, bio, avatar, theme, notifications, privacy, etc.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Username already taken

  /users/me/change-password:
    post:
      tags: [users]
      operationId: changePassword
      summary: Change the authenticated user's password
      x-rate-limit:
        max: 3
        windowSeconds: 3600
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password changed
        "401":
          description: Current password is incorrect

  /users/{username}/public:
    get:
      tags: [users]
      operationId: getPublicProfile
      summary: Get a user's public profile
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public profile data
        "404":
          description: User not found

  # ================================================================
  # AGENT — Chat
  # ================================================================
  /agent/chat:
    post:
      tags: [agent]
      operationId: chat
      summary: Send a message to the AI agent
      description: |
        Core chat endpoint with ReAct tool-use loop. Supports intent classification,
        action execution (reminders, code gen, web research), and multi-provider routing
        (Ollama, OpenRouter, Groq, Edith). Returns a structured response with receipts.
      x-rate-limit:
        max: 60
        windowSeconds: 900
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Agent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /agent/chat/stream:
    post:
      tags: [agent]
      operationId: chatStream
      summary: Stream a chat response via SSE
      description: |
        Server-Sent Events streaming endpoint. Emits `delta` (token chunks),
        `action` (tool results), `done` (completion metadata), and `error` events.
        Complex intents trigger a visible ReAct thinking loop.
      x-rate-limit:
        max: 60
        windowSeconds: 900
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE events: delta, action, done, error"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitError"

  /agent/chat/public/{username}:
    post:
      tags: [agent]
      operationId: publicChat
      summary: Chat with a user's public portfolio agent
      description: |
        Unauthenticated endpoint for portfolio visitors. IP rate-limited to 10/hr.
        Falls back Groq -> openrouter-free. Supports escalation to the portfolio
        owner via Telegram.
      x-rate-limit:
        max: 10
        windowSeconds: 900
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Agent response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "404":
          description: User not found or public chat disabled
        "429":
          $ref: "#/components/responses/RateLimitError"

  /agent/command:
    post:
      tags: [agent]
      operationId: agentCommand
      summary: Execute a slash command via the agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Command result
        "400":
          $ref: "#/components/responses/ValidationError"

  # ================================================================
  # AGENT — Config
  # ================================================================
  /agent/config:
    get:
      tags: [agent]
      operationId: getAgentConfig
      summary: Get the agent configuration
      responses:
        "200":
          description: Agent config row
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentConfig"
        "404":
          description: Config not found
    patch:
      tags: [agent]
      operationId: updateAgentConfig
      summary: Update agent personality, mode, or settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                mode:
                  type: string
                  enum: [builder, assistant, creative, analyst]
                voice:
                  type: string
                systemPrompt:
                  type: string
                personality:
                  type: string
                primaryModel:
                  type: string
      responses:
        "200":
          description: Config updated

  # ================================================================
  # AGENT — Memory
  # ================================================================
  /agent/memory:
    get:
      tags: [agent]
      operationId: listMemories
      summary: List agent memories
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        "200":
          description: Array of memory entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
    post:
      tags: [agent]
      operationId: createMemory
      summary: Create or upsert a memory entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, key, value]
              properties:
                category:
                  type: string
                key:
                  type: string
                value:
                  type: string
                confidence:
                  type: number
                source:
                  type: string
      responses:
        "201":
          description: Memory created

  /agent/memory/{id}:
    put:
      tags: [agent]
      operationId: updateMemory
      summary: Update a specific memory entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                confidence:
                  type: number
      responses:
        "200":
          description: Memory updated
        "404":
          description: Memory not found
    delete:
      tags: [agent]
      operationId: deleteMemory
      summary: Delete a specific memory entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Memory deleted

  # ================================================================
  # AGENT — Conversations
  # ================================================================
  /agent/conversations:
    get:
      tags: [agent]
      operationId: listConversations
      summary: Get recent conversation history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Array of conversation messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"

  /agent/conversations/export:
    get:
      tags: [agent]
      operationId: exportConversations
      summary: Export conversation history as JSON or Markdown
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, markdown]
            default: json
      responses:
        "200":
          description: Exported file attachment

  /agent/conversations/{id}/star:
    post:
      tags: [agent]
      operationId: toggleStar
      summary: Toggle star status on a message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Star toggled

  /agent/conversations/{id}/rating:
    post:
      tags: [agent]
      operationId: rateMessage
      summary: Set a 1-5 quality score on an assistant message
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
      responses:
        "200":
          description: Rating recorded

  # ================================================================
  # AGENT — Premium
  # ================================================================
  /agent/quality:
    get:
      tags: [agent]
      operationId: getQualityMetrics
      summary: Get satisfaction rate from message reactions
      responses:
        "200":
          description: Quality metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  satisfactionRate:
                    type: integer
                    nullable: true
                  totalMessages:
                    type: integer
                  positive:
                    type: integer
                  negative:
                    type: integer

  /agent/deploy-premium:
    post:
      tags: [agent]
      operationId: deployPremiumSession
      summary: Deploy a named specialist session (paid plans only, 100 credits)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [specialistType]
              properties:
                specialistType:
                  type: string
      responses:
        "200":
          description: Session deployed
        "402":
          description: Payment required (free plan)

  # ================================================================
  # BILLING
  # ================================================================
  /billing/plans:
    get:
      tags: [billing]
      operationId: listPlans
      summary: List all available subscription plans
      security: []
      responses:
        "200":
          description: Array of plan definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    credits:
                      type: integer
                    priceUsd:
                      type: number
                    priceInr:
                      type: number
                    intervalDays:
                      type: integer

  /billing/plan:
    get:
      tags: [billing]
      operationId: getCurrentPlan
      summary: Get current subscription and credit balance
      responses:
        "200":
          description: Subscription details

  /billing/upgrade:
    post:
      tags: [billing]
      operationId: upgradePlan
      summary: Change plan (dev/test only when Stripe is disabled)
      x-rate-limit:
        max: 5
        windowSeconds: 3600
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  type: string
                currency:
                  type: string
                  enum: [USD, INR]
      responses:
        "200":
          description: Plan updated
        "403":
          description: Stripe is enabled; use /checkout instead

  /billing/checkout:
    post:
      tags: [billing]
      operationId: createCheckout
      summary: Create a Stripe Checkout session
      x-rate-limit:
        max: 5
        windowSeconds: 3600
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  type: string
                  enum: [pilot, intro, halfyear, yearly]
      responses:
        "200":
          description: Checkout session URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    format: uri
        "503":
          description: Stripe not configured

  /billing/usage:
    get:
      tags: [billing]
      operationId: getBillingUsage
      summary: Get daily usage for the current billing cycle
      responses:
        "200":
          description: Array of daily usage rows

  /billing/status:
    get:
      tags: [billing]
      operationId: getBillingStatus
      summary: Get current Stripe subscription status and expiry
      responses:
        "200":
          description: Subscription status

  /billing/events:
    get:
      tags: [billing]
      operationId: getBillingEvents
      summary: Last 20 usage events for credit history
      responses:
        "200":
          description: Array of usage events

  /billing/day-pass:
    get:
      tags: [billing]
      operationId: checkDayPass
      summary: Check if user has an active day pass
      responses:
        "200":
          description: Day pass status
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                  expiresAt:
                    type: string
                    format: date-time
                    nullable: true
    post:
      tags: [billing]
      operationId: activateDayPass
      summary: Activate a 24-hour day pass (free plan, dev mode only)
      x-rate-limit:
        max: 5
        windowSeconds: 3600
      responses:
        "200":
          description: Day pass activated
        "400":
          description: Already active or not on free plan
        "503":
          description: Stripe is enabled; day pass via Stripe not yet available

  /billing/razorpay/order:
    post:
      tags: [billing]
      operationId: createRazorpayOrder
      summary: Create a Razorpay order for INR payment
      x-rate-limit:
        max: 5
        windowSeconds: 3600
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  type: string
                  enum: [pilot, intro, halfyear, yearly]
      responses:
        "200":
          description: Razorpay order created
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: string
                  amount:
                    type: integer
                  currency:
                    type: string
                  keyId:
                    type: string
        "503":
          description: Razorpay not configured

  /billing/razorpay/verify:
    post:
      tags: [billing]
      operationId: verifyRazorpayPayment
      summary: Verify Razorpay payment signature and upgrade subscription
      x-rate-limit:
        max: 5
        windowSeconds: 3600
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [razorpay_order_id, razorpay_payment_id, razorpay_signature, plan]
              properties:
                razorpay_order_id:
                  type: string
                razorpay_payment_id:
                  type: string
                razorpay_signature:
                  type: string
                plan:
                  type: string
      responses:
        "200":
          description: Payment verified and plan upgraded
        "400":
          description: Signature verification failed

  /billing/webhook:
    post:
      tags: [billing]
      operationId: stripeWebhook
      summary: Stripe webhook receiver
      description: |
        Receives Stripe webhook events (checkout.session.completed, etc.).
        Requires raw body for signature verification via `Stripe-Signature` header.
        Endpoint uses `express.raw()` middleware.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook received
        "400":
          description: Invalid signature

  # ================================================================
  # REMINDERS
  # ================================================================
  /reminders:
    get:
      tags: [reminders]
      operationId: listReminders
      summary: List all reminders for the authenticated user
      description: Returns reminders sorted by datetime ASC. Supports ETag-based conditional GET.
      responses:
        "200":
          description: Array of reminders
          content:
            application/json:
              schema:
                type: array
                items:
