      operationId: createReminder
      summary: Create a new reminder
      description: Includes near-duplicate detection (warns if a similar active reminder exists).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderCreate"
      responses:
        "201":
          description: Reminder created
