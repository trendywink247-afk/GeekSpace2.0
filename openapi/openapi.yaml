          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                datetime:
                  type: string
                channel:
                  type: string
                category:
                  type: string
                priority:
                  type: string
      responses:
        "200":
          description: Updated reminder
        "404":
          description: Reminder not found
    delete:
