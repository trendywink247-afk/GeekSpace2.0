# =============================================================
# Caddy Security Headers Snippet for Agentin
# =============================================================
#
# HOW TO USE:
# 1. Review these headers and adjust CSP to your needs
# 2. Copy the (security_headers) snippet into /etc/caddy/Caddyfile
# 3. Replace your existing (common_headers) snippet or merge with it
# 4. Run: caddy validate --config /etc/caddy/Caddyfile
# 5. Run: systemctl reload caddy
#
# NOTE: The live Caddyfile at /etc/caddy/Caddyfile already has
# (common_headers) with most of these. This file documents the
# recommended baseline and any additions.
# =============================================================

(security_headers) {
    header {
        # Prevent clickjacking
        X-Frame-Options "DENY"

        # Prevent MIME-type sniffing
        X-Content-Type-Options "nosniff"

        # Control referrer information
        Referrer-Policy "strict-origin-when-cross-origin"

        # Restrict browser features
        Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"

        # HSTS — enforce HTTPS for 1 year with subdomains
        Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"

        # Disable legacy XSS auditor (can cause issues; CSP is the modern replacement)
        X-XSS-Protection "0"

        # Remove server identification
        -Server

        # Content Security Policy
        # Allows: self, inline styles (shadcn/Tailwind), Google Fonts, images from any HTTPS,
        # WebSocket connections (SSE/WS), blob: for generated content
        Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' wss: https:; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; upgrade-insecure-requests"

        # Cross-Origin policies (defense in depth)
        Cross-Origin-Opener-Policy "same-origin"
        Cross-Origin-Embedder-Policy "credentialless"
        Cross-Origin-Resource-Policy "same-origin"
    }
}

# =============================================================
# COMPARISON WITH CURRENT Caddyfile (common_headers):
#
# Already present (no changes needed):
#   - X-Frame-Options: DENY
#   - X-Content-Type-Options: nosniff
#   - Referrer-Policy: strict-origin-when-cross-origin
#   - Permissions-Policy: camera=(), microphone=(), geolocation=()
#   - Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
#   - X-XSS-Protection: 0
#   - Content-Security-Policy (basic version)
#
# Recommended additions:
#   - Permissions-Policy: add payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()
#   - CSP: add worker-src 'self' blob:, media-src 'self' blob:, base-uri 'self'
#   - Cross-Origin-Opener-Policy: same-origin
#   - Cross-Origin-Embedder-Policy: credentialless
#   - Cross-Origin-Resource-Policy: same-origin
#   - -Server (remove server header)
# =============================================================
