name: "Ops: Remote Exec"
run-name: "Ops: ${{ inputs.action }} on production VPS"

# ---------------------------------------------------------------------------
# Sanctioned path for running approved ops commands on the production VPS
# without provisioning per-agent SSH credentials.
#
# How it works:
#   * workflow_dispatch only — no push/PR/schedule triggers
#   * Gated by the `production-ops` GitHub Environment, which is configured
#     in repo settings with required reviewers. Every dispatch pauses for
#     human approval before the job runs, regardless of which ref triggered
#     it. DEPLOY_HOST / DEPLOY_SSH_KEY are scoped to this environment.
#   * `action` input is a closed choice list; each case maps to a fixed shell
#     snippet executed over SSH via the existing DEPLOY_HOST / DEPLOY_SSH_KEY
#     secrets (reused from deploy.yml)
#   * Full stdout/stderr is echoed to the run log for audit
#
# Adding a new action:
#   1. Add it to the `action` input `options` list below
#   2. Add a matching `case` arm to the script — keep the commands fully
#      literal (no user-supplied strings interpolated into shell)
#   3. Land via PR so the whitelist change gets normal code review
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Whitelisted ops action to run on the VPS'
        required: true
        type: choice
        options:
          - docker-builder-prune
          - ssh-keys-audit
          - rotate-jwt-encryption-preview
      reason:
        description: 'Why you are running this (for the run log / audit trail)'
        required: true
        type: string

concurrency:
  group: ops-remote-exec
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  remote-exec:
    name: Remote Exec (${{ inputs.action }})
    runs-on: ubuntu-latest
    # Hard-gate: production-ops is a GitHub Environment with required
    # reviewers (configured in repo Settings → Environments). The job
    # pauses until a reviewer approves, and DEPLOY_HOST / DEPLOY_SSH_KEY
    # are scoped to this environment so a forked/branch workflow file
    # cannot read them without approval.
    environment:
      name: production-ops
      url: https://ai.agentin.chat
    steps:
      - name: Record dispatch metadata
        env:
          OPS_ACTION: ${{ inputs.action }}
          OPS_REASON: ${{ inputs.reason }}
          OPS_ACTOR: ${{ github.actor }}
          OPS_REF: ${{ github.ref }}
          OPS_RUN_ID: ${{ github.run_id }}
        run: |
          echo "=== Ops dispatch ==="
          echo "action:  $OPS_ACTION"
          echo "reason:  $OPS_REASON"
          echo "actor:   $OPS_ACTOR"
          echo "ref:     $OPS_REF"
          echo "run:     $OPS_RUN_ID"

      - name: Execute remote action
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: OPS_ACTION
          script: |
            set -euo pipefail
            ACTION="${OPS_ACTION:-}"
            echo "=== Remote host: $(hostname) ==="
            echo "=== Action:      $ACTION ==="
            echo "=== Started:     $(date -u +%FT%TZ) ==="
            echo

            case "$ACTION" in
              docker-builder-prune)
                echo "--- df -h / (before) ---"
                df -h /
                echo
                echo "--- docker system df (before) ---"
                docker system df || true
                echo
                echo "--- docker builder prune -af ---"
                docker builder prune -af
                echo
                echo "--- docker system df (after) ---"
                docker system df || true
                echo
                echo "--- df -h / (after) ---"
                df -h /
                ;;
              ssh-keys-audit)
                # Read-only inventory of /root/.ssh/authorized_keys. Emits
                # key type, SHA256 fingerprint, bit length, and comment for
                # each active line. Prints file mode + mtime. Does NOT emit
                # the base64 key material. Output is pasted into
                # docs/SSH-ACCESS.md under "Human Key Inventory" via PR.
                AUTH_KEYS=/root/.ssh/authorized_keys
                echo "--- authorized_keys metadata ---"
                ls -la "$AUTH_KEYS" || { echo "ERROR: $AUTH_KEYS missing" >&2; exit 1; }
                stat -c 'mode=%a owner=%U:%G mtime=%y' "$AUTH_KEYS"
                echo
                echo "--- line count (incl. blanks/comments) ---"
                wc -l "$AUTH_KEYS"
                echo
                echo "--- active entries (ssh-keygen -lf) ---"
                # ssh-keygen -lf on the file prints one fingerprint per key
                # line and ignores blank/comment lines. Safe: no private
                # material, just type + fingerprint + comment. If any line
                # is malformed (legacy/corrupt), ssh-keygen exits non-zero
                # and set -e would abort the whole arm — tolerate that so
                # the raw-comment pass below still surfaces skipped lines.
                ssh-keygen -lf "$AUTH_KEYS" || echo "note: ssh-keygen exited non-zero — at least one line may be malformed; see raw-comment pass below"
                echo
                echo "--- comment field per line (for owner reconciliation) ---"
                # Everything after the base64 key blob. Handles multi-word
                # comments (e.g. "alice@laptop primary laptop") and lines
                # that start with options (command=, from=, environment=).
                # Strategy: locate the field that looks like a base64 key
                # blob (long, only base64 chars) and print everything after
                # it verbatim.
                awk 'NF && $1 !~ /^#/ {
                  key_i = 0
                  for (i = 1; i <= NF; i++) {
                    if (length($i) > 40 && $i ~ /^[A-Za-z0-9+\/=]+$/) { key_i = i; break }
                  }
                  if (key_i == 0) { print NR": [no key blob detected] "$0; next }
                  comment = ""
                  for (j = key_i + 1; j <= NF; j++) {
                    comment = (comment == "" ? $j : comment" "$j)
                  }
                  print NR": "comment
                }' "$AUTH_KEYS"
                ;;
              rotate-jwt-encryption-preview)
                # Dry-run validator for the future rotate-jwt-encryption
                # action. Confirms the pipe works end-to-end without
                # touching any live secret. Generates candidate values,
                # verifies /root/.agentin-secrets is present and mode 600,
                # verifies a backup path is writable, and reports the
                # current key names present. Makes NO changes.
                SECRETS_FILE=/root/.agentin-secrets
                echo "--- preflight ---"
                if [ ! -f "$SECRETS_FILE" ]; then
                  echo "ERROR: $SECRETS_FILE missing" >&2
                  exit 1
                fi
                stat -c 'mode=%a owner=%U:%G size=%s mtime=%y' "$SECRETS_FILE"
                MODE=$(stat -c '%a' "$SECRETS_FILE")
                if [ "$MODE" != "600" ]; then
                  echo "WARN: expected mode 600, got $MODE" >&2
                fi
                echo
                echo "--- keys currently present (names only, no values) ---"
                # Print only the variable names, never the values.
                awk -F= 'NF && $1 !~ /^#/ { print $1 }' "$SECRETS_FILE" | sort -u
                echo
                echo "--- candidate JWT_SECRET (length check only, not written) ---"
                CANDIDATE_JWT=$(openssl rand -hex 64)
                echo "length=${#CANDIDATE_JWT} expected=128"
                echo
                echo "--- candidate ENCRYPTION_KEY (length check only, not written) ---"
                CANDIDATE_ENC=$(openssl rand -hex 32)
                echo "length=${#CANDIDATE_ENC} expected=64"
                echo
                echo "--- backup path check (read-only) ---"
                # Do NOT create or re-permission the backup dir from the
                # preview — an operator may manage /root/secret-backups
                # with specific ACLs/mode, and a silent mkdir+chmod would
                # change behavior behind their back. Only report current
                # state. The real rotate-jwt-encryption action is the
                # place that creates/chmods the backup dir if missing.
                BACKUP_DIR=/root/secret-backups
                if [ -e "$BACKUP_DIR" ]; then
                  if [ -d "$BACKUP_DIR" ]; then
                    stat -c "exists: dir mode=%a owner=%U:%G" "$BACKUP_DIR"
                    if [ -w "$BACKUP_DIR" ]; then
                      echo "ok: $BACKUP_DIR is writable by the current user (root)"
                    else
                      echo "WARN: $BACKUP_DIR exists but is not writable by the current user" >&2
                    fi
                  else
                    echo "ERROR: $BACKUP_DIR exists but is not a directory" >&2
                  fi
                else
                  echo "note: $BACKUP_DIR does not exist yet; rotate-jwt-encryption will create it with mode 700"
                fi
                echo
                echo "NOTE: preview only — no secret was written, no service was restarted, no directory was created."
                ;;
              *)
                echo "ERROR: unknown or unlisted action: $ACTION" >&2
                exit 1
                ;;
            esac

            echo
            echo "=== Finished:    $(date -u +%FT%TZ) ==="
        env:
          OPS_ACTION: ${{ inputs.action }}
