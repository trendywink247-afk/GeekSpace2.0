name: "Ops: Remote Exec"
run-name: "Ops: ${{ inputs.action }} on production VPS"

# ---------------------------------------------------------------------------
# Sanctioned path for running approved ops commands on the production VPS
# without provisioning per-agent SSH credentials.
#
# How it works:
#   * workflow_dispatch only — no push/PR/schedule triggers
#   * Gated by the `production-ops` GitHub Environment, which is configured
#     in repo settings with required reviewers. Every dispatch pauses for
#     human approval before the job runs, regardless of which ref triggered
#     it. DEPLOY_HOST / DEPLOY_SSH_KEY are scoped to this environment.
#   * `action` input is a closed choice list; each case maps to a fixed shell
#     snippet executed over SSH via the existing DEPLOY_HOST / DEPLOY_SSH_KEY
#     secrets (reused from deploy.yml)
#   * Full stdout/stderr is echoed to the run log for audit
#
# Adding a new action:
#   1. Add it to the `action` input `options` list below
#   2. Add a matching `case` arm to the script — keep the commands fully
#      literal (no user-supplied strings interpolated into shell)
#   3. Land via PR so the whitelist change gets normal code review
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Whitelisted ops action to run on the VPS'
        required: true
        type: choice
        options:
          - docker-builder-prune
          - ssh-keys-audit
          - rotate-jwt-encryption-preview
          - remove-ssh-key
          - litestream-install
          - litestream-status
          - litestream-restore-drill
          - rotate-jwt-encryption
          - rotate-jwt-encryption-rollback
      reason:
        description: 'Why you are running this (for the run log / audit trail)'
        required: true
        type: string
      key_identifier:
        description: 'remove-ssh-key only: SHA256 fingerprint (preferred) or exact key comment to remove from /root/.ssh/authorized_keys. Ignored by other actions.'
        required: false
        type: string
        default: ''

concurrency:
  group: ops-remote-exec
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  remote-exec:
    name: Remote Exec (${{ inputs.action }})
    runs-on: ubuntu-latest
    # Hard-gate: production-ops is a GitHub Environment with required
    # reviewers (configured in repo Settings → Environments). The job
    # pauses until a reviewer approves, and DEPLOY_HOST / DEPLOY_SSH_KEY
    # are scoped to this environment so a forked/branch workflow file
    # cannot read them without approval.
    environment:
      name: production-ops
      url: https://ai.agentin.chat
    steps:
      - name: Record dispatch metadata
        env:
          OPS_ACTION: ${{ inputs.action }}
          OPS_REASON: ${{ inputs.reason }}
          OPS_KEY_IDENTIFIER: ${{ inputs.key_identifier }}
          OPS_ACTOR: ${{ github.actor }}
          OPS_REF: ${{ github.ref }}
          OPS_RUN_ID: ${{ github.run_id }}
        run: |
          echo "=== Ops dispatch ==="
          echo "action:       $OPS_ACTION"
          echo "reason:       $OPS_REASON"
          echo "key_ident:    ${OPS_KEY_IDENTIFIER:-<none>}"
          echo "actor:        $OPS_ACTOR"
          echo "ref:          $OPS_REF"
          echo "run:          $OPS_RUN_ID"

      - name: Execute remote action
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          # Forward OPS_ACTION + OPS_KEY_IDENTIFIER + R2 env vars to the
          # remote session. R2_* are empty for non-litestream actions and
          # OPS_KEY_IDENTIFIER is empty for non-remove-ssh-key actions; each
          # case reads only what it needs. R2_BUCKET is conditionally
          # forwarded only when the secret is set so an unset secret preserves
          # install-litestream.sh's default bucket (AGE-15 P2).
          envs: OPS_ACTION,OPS_KEY_IDENTIFIER,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY${{ secrets.R2_BUCKET != '' && ',R2_BUCKET' || '' }}
          script: |
            set -euo pipefail
            ACTION="${OPS_ACTION:-}"
            echo "=== Remote host: $(hostname) ==="
            echo "=== Action:      $ACTION ==="
            echo "=== Started:     $(date -u +%FT%TZ) ==="
            echo

            case "$ACTION" in
              docker-builder-prune)
                echo "--- df -h / (before) ---"
                df -h /
                echo
                echo "--- docker system df (before) ---"
                docker system df || true
                echo
                echo "--- docker builder prune -af ---"
                docker builder prune -af
                echo
                echo "--- docker system df (after) ---"
                docker system df || true
                echo
                echo "--- df -h / (after) ---"
                df -h /
                ;;
              ssh-keys-audit)
                # Read-only inventory of /root/.ssh/authorized_keys. Emits
                # key type, SHA256 fingerprint, bit length, and comment for
                # each active line. Prints file mode + mtime. Does NOT emit
                # the base64 key material. Output is pasted into
                # docs/SSH-ACCESS.md under "Human Key Inventory" via PR.
                AUTH_KEYS=/root/.ssh/authorized_keys
                echo "--- authorized_keys metadata ---"
                ls -la "$AUTH_KEYS" || { echo "ERROR: $AUTH_KEYS missing" >&2; exit 1; }
                stat -c 'mode=%a owner=%U:%G mtime=%y' "$AUTH_KEYS"
                echo
                echo "--- line count (incl. blanks/comments) ---"
                wc -l "$AUTH_KEYS"
                echo
                echo "--- active entries (ssh-keygen -lf) ---"
                # ssh-keygen -lf on the file prints one fingerprint per key
                # line and ignores blank/comment lines. Safe: no private
                # material, just type + fingerprint + comment. If any line
                # is malformed (legacy/corrupt), ssh-keygen exits non-zero
                # and set -e would abort the whole arm — tolerate that so
                # the raw-comment pass below still surfaces skipped lines.
                ssh-keygen -lf "$AUTH_KEYS" || echo "note: ssh-keygen exited non-zero — at least one line may be malformed; see raw-comment pass below"
                echo
                echo "--- comment field per line (for owner reconciliation) ---"
                # Everything after the base64 key blob. Handles multi-word
                # comments (e.g. "alice@laptop primary laptop") and lines
                # that start with options (command=, from=, environment=).
                # Strategy: locate the field that looks like a base64 key
                # blob (long, only base64 chars) and print everything after
                # it verbatim.
                awk 'NF && $1 !~ /^#/ {
                  key_i = 0
                  for (i = 1; i <= NF; i++) {
                    if (length($i) > 40 && $i ~ /^[A-Za-z0-9+\/=]+$/) { key_i = i; break }
                  }
                  if (key_i == 0) { print NR": [no key blob detected] "$0; next }
                  comment = ""
                  for (j = key_i + 1; j <= NF; j++) {
                    comment = (comment == "" ? $j : comment" "$j)
                  }
                  print NR": "comment
                }' "$AUTH_KEYS"
                ;;
              rotate-jwt-encryption-preview)
                # Dry-run validator for the future rotate-jwt-encryption
                # action. Confirms the pipe works end-to-end without
                # touching any live secret. Generates candidate values,
                # verifies /root/.agentin-secrets is present and mode 600,
                # verifies a backup path is writable, and reports the
                # current key names present. Makes NO changes.
                SECRETS_FILE=/root/.agentin-secrets
                echo "--- preflight ---"
                if [ ! -f "$SECRETS_FILE" ]; then
                  echo "ERROR: $SECRETS_FILE missing" >&2
                  exit 1
                fi
                stat -c 'mode=%a owner=%U:%G size=%s mtime=%y' "$SECRETS_FILE"
                MODE=$(stat -c '%a' "$SECRETS_FILE")
                if [ "$MODE" != "600" ]; then
                  echo "WARN: expected mode 600, got $MODE" >&2
                fi
                echo
                echo "--- keys currently present (names only, no values) ---"
                # Print only the variable names, never the values.
                awk -F= 'NF && $1 !~ /^#/ { print $1 }' "$SECRETS_FILE" | sort -u
                echo
                echo "--- candidate JWT_SECRET (length check only, not written) ---"
                CANDIDATE_JWT=$(openssl rand -hex 64)
                echo "length=${#CANDIDATE_JWT} expected=128"
                echo
                echo "--- candidate ENCRYPTION_KEY (length check only, not written) ---"
                CANDIDATE_ENC=$(openssl rand -hex 32)
                echo "length=${#CANDIDATE_ENC} expected=64"
                echo
                echo "--- backup path check (read-only) ---"
                # Do NOT create or re-permission the backup dir from the
                # preview — an operator may manage /root/secret-backups
                # with specific ACLs/mode, and a silent mkdir+chmod would
                # change behavior behind their back. Only report current
                # state. The real rotate-jwt-encryption action is the
                # place that creates/chmods the backup dir if missing.
                BACKUP_DIR=/root/secret-backups
                if [ -e "$BACKUP_DIR" ]; then
                  if [ -d "$BACKUP_DIR" ]; then
                    stat -c "exists: dir mode=%a owner=%U:%G" "$BACKUP_DIR"
                    if [ -w "$BACKUP_DIR" ]; then
                      echo "ok: $BACKUP_DIR is writable by the current user (root)"
                    else
                      echo "WARN: $BACKUP_DIR exists but is not writable by the current user" >&2
                    fi
                  else
                    echo "ERROR: $BACKUP_DIR exists but is not a directory" >&2
                  fi
                else
                  echo "note: $BACKUP_DIR does not exist yet; rotate-jwt-encryption will create it with mode 700"
                fi
                echo
                echo "NOTE: preview only — no secret was written, no service was restarted, no directory was created."
                ;;
              remove-ssh-key)
                # Destructive: removes a single line from /root/.ssh/authorized_keys.
                # Matches by SHA256 fingerprint (preferred) or exact key comment.
                # Safeguards:
                #   - refuses if key_identifier is empty
                #   - refuses on zero matches (no silent no-op)
                #   - refuses on >1 matches (ambiguous)
                #   - writes a timestamped backup before mutation
                #   - prints a before/after diff with the base64 key blob redacted
                #   - preserves mode 600 on the file
                IDENT="${OPS_KEY_IDENTIFIER:-}"
                if [ -z "$IDENT" ]; then
                  echo "ERROR: key_identifier input is required for remove-ssh-key" >&2
                  exit 1
                fi
                AUTH_KEYS=/root/.ssh/authorized_keys
                if [ ! -f "$AUTH_KEYS" ]; then
                  echo "ERROR: $AUTH_KEYS missing" >&2
                  exit 1
                fi

                echo "--- target identifier ---"
                echo "$IDENT"
                echo

                # Redactor: blanks out the base64 key blob so the audit log
                # never carries the raw material.
                REDACT_AWK='{
                  for (i = 1; i <= NF; i++) {
                    if (length($i) > 40 && $i ~ /^[A-Za-z0-9+\/=]+$/) { $i = "<redacted-key>" }
                  }
                  print
                }'

                # Pass 1: match by SHA256 fingerprint. Per-line so a malformed
                # line never drags the whole pass with it.
                MATCH_LINES=""
                LINE_NO=0
                while IFS= read -r line || [ -n "$line" ]; do
                  LINE_NO=$((LINE_NO + 1))
                  case "$line" in
                    ''|\#*) continue ;;
                  esac
                  FP=$(printf '%s\n' "$line" | ssh-keygen -lf - 2>/dev/null | awk '{print $2}')
                  if [ -n "$FP" ] && [ "$FP" = "$IDENT" ]; then
                    MATCH_LINES="$MATCH_LINES $LINE_NO"
                  fi
                done < "$AUTH_KEYS"

                # Pass 2: fall back to exact key-comment match (post-key-blob
                # field) only if fingerprint pass found nothing.
                if [ -z "$MATCH_LINES" ]; then
                  LINE_NO=0
                  while IFS= read -r line || [ -n "$line" ]; do
                    LINE_NO=$((LINE_NO + 1))
                    case "$line" in
                      ''|\#*) continue ;;
                    esac
                    COMMENT=$(printf '%s\n' "$line" | awk '{
                      ki = 0
                      for (i = 1; i <= NF; i++) {
                        if (length($i) > 40 && $i ~ /^[A-Za-z0-9+\/=]+$/) { ki = i; break }
                      }
                      if (ki == 0) next
                      out = ""
                      for (j = ki + 1; j <= NF; j++) {
                        out = (out == "" ? $j : out" "$j)
                      }
                      print out
                    }')
                    if [ -n "$COMMENT" ] && [ "$COMMENT" = "$IDENT" ]; then
                      MATCH_LINES="$MATCH_LINES $LINE_NO"
                    fi
                  done < "$AUTH_KEYS"
                fi

                MATCH_LINES=$(echo $MATCH_LINES | xargs)
                if [ -z "$MATCH_LINES" ]; then
                  echo "ERROR: no key matched identifier '$IDENT' (tried SHA256 fingerprint, then exact key comment)" >&2
                  exit 1
                fi
                COUNT=$(echo "$MATCH_LINES" | wc -w)
                if [ "$COUNT" -gt 1 ]; then
                  echo "ERROR: identifier '$IDENT' matched multiple lines ($MATCH_LINES) — refusing to remove an ambiguous set" >&2
                  exit 1
                fi

                TARGET_LINE="$MATCH_LINES"
                echo "--- matched line: $TARGET_LINE ---"
                echo

                STAMP=$(date -u +%Y%m%dT%H%M%SZ)
                BACKUP="${AUTH_KEYS}.bak.${STAMP}"
                cp -p "$AUTH_KEYS" "$BACKUP"
                chmod 600 "$BACKUP"
                echo "--- backup: $BACKUP ---"
                stat -c 'mode=%a owner=%U:%G size=%s' "$BACKUP"
                echo

                echo "--- before (line count) ---"
                wc -l "$AUTH_KEYS"
                echo "--- removing (redacted) ---"
                sed -n "${TARGET_LINE}p" "$AUTH_KEYS" | awk "$REDACT_AWK"
                echo

                sed -i "${TARGET_LINE}d" "$AUTH_KEYS"
                chmod 600 "$AUTH_KEYS"

                echo "--- after (line count) ---"
                wc -l "$AUTH_KEYS"
                stat -c 'mode=%a owner=%U:%G mtime=%y' "$AUTH_KEYS"
                echo

                echo "--- diff (redacted) ---"
                # Use temp files instead of bash process substitution so this
                # arm also runs under plain sh if the remote login shell
                # defaults away from bash.
                REDACTED_BEFORE=$(mktemp)
                REDACTED_AFTER=$(mktemp)
                chmod 600 "$REDACTED_BEFORE" "$REDACTED_AFTER"
                awk "$REDACT_AWK" "$BACKUP" > "$REDACTED_BEFORE"
                awk "$REDACT_AWK" "$AUTH_KEYS" > "$REDACTED_AFTER"
                diff "$REDACTED_BEFORE" "$REDACTED_AFTER" || true
                rm -f "$REDACTED_BEFORE" "$REDACTED_AFTER"
                echo
                echo "NOTE: original file preserved at $BACKUP (mode 600). Remove manually via a follow-up dispatch or sanctioned ops action once the removal is confirmed."
                ;;
              litestream-install)
                if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ]; then
                  echo "ERROR: R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY must be set as repo secrets in the production-ops environment." >&2
                  exit 1
                fi
                echo "--- Refreshing repo to current origin/main ---"
                cd ~/GeekSpace2.0
                git fetch --quiet origin main
                git reset --hard origin/main
                echo
                echo "--- Running ops/litestream/install-litestream.sh ---"
                bash ops/litestream/install-litestream.sh
                echo
                echo "--- Post-install status ---"
                systemctl --no-pager --full status litestream.service || true
                ;;
              litestream-status)
                echo "--- systemctl status litestream.service ---"
                systemctl --no-pager --full status litestream.service || true
                echo
                echo "--- litestream databases ---"
                litestream databases -config /etc/litestream.yml || true
                echo
                echo "--- litestream snapshots ---"
                litestream snapshots -config /etc/litestream.yml /var/lib/docker/volumes/geekspace20_geekspace-data/_data/geekspace.db || true
                echo
                echo "--- journalctl -u litestream.service --since -10m ---"
                journalctl -u litestream.service --since '-10 minutes' --no-pager || true
                ;;
              litestream-restore-drill)
                if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${R2_ACCESS_KEY_ID:-}" ] || [ -z "${R2_SECRET_ACCESS_KEY:-}" ]; then
                  echo "ERROR: R2_* secrets must be set in the production-ops environment." >&2
                  exit 1
                fi
                DRILL_DIR="/tmp/litestream-drill-$(date -u +%Y%m%dT%H%M%SZ)"
                mkdir -p "$DRILL_DIR"
                DEST="${DRILL_DIR}/geekspace.db"
                echo "--- Restoring latest snapshot to ${DEST} (never touches live DB) ---"
                # Litestream reads env-substituted /etc/litestream.yml, so the
                # same config file drives restore.
                litestream restore -config /etc/litestream.yml -o "$DEST" \
                  /var/lib/docker/volumes/geekspace20_geekspace-data/_data/geekspace.db
                echo
                echo "--- Restored file size ---"
                ls -lh "$DEST"
                echo
                echo "--- PRAGMA integrity_check ---"
                # Validate the check actually returned "ok" — otherwise the
                # drill silently "passes" on a corrupted restore (AGE-15 P1).
                INTEGRITY_RESULT="$(sqlite3 "$DEST" 'PRAGMA integrity_check;')"
                echo "$INTEGRITY_RESULT"
                if [ "$INTEGRITY_RESULT" != "ok" ]; then
                  echo "ERROR: integrity_check did not return 'ok' — restore drill FAILED" >&2
                  rm -rf "$DRILL_DIR"
                  exit 1
                fi
                echo
                echo "--- SELECT COUNT(*) FROM users (smoke row count) ---"
                # No `|| true` — a restored DB without the users table is a
                # corrupt restore and should fail the drill loudly (AGE-15 P1).
                sqlite3 "$DEST" 'SELECT COUNT(*) FROM users;'
                echo
                if command -v at >/dev/null 2>&1 && echo "rm -rf '$DRILL_DIR'" | at now + 1 hour 2>/dev/null; then
                  echo "--- Cleanup: ${DRILL_DIR} scheduled for rm via at in 1h ---"
                else
                  echo "--- Cleanup: removing ${DRILL_DIR} immediately (at unavailable or scheduling failed) ---"
                  rm -rf "$DRILL_DIR"
                fi
                ;;
              rotate-jwt-encryption)
                # REAL rotation. Delegates to ops/rotate-app-secrets.sh checked
                # into the repo at /root/GeekSpace2.0. The VPS copy is kept in
                # sync by the staging/production deploy paths (they reset to
                # origin/main before building). We refuse to run against a
                # dirty tree so the whitelist commit matches what executes.
                REPO_DIR=/root/GeekSpace2.0
                SCRIPT="$REPO_DIR/ops/rotate-app-secrets.sh"
                if [ ! -x "$SCRIPT" ]; then
                  echo "ERROR: $SCRIPT missing or not executable" >&2
                  exit 1
                fi
                echo "--- repo head ---"
                git -C "$REPO_DIR" rev-parse --short HEAD
                if ! git -C "$REPO_DIR" diff --quiet HEAD --; then
                  echo "ERROR: $REPO_DIR working tree is dirty — refusing to rotate" >&2
                  exit 1
                fi
                echo
                echo "--- rotate-app-secrets.sh --re-encrypt ---"
                "$SCRIPT" --re-encrypt
                ;;
              rotate-jwt-encryption-rollback)
                # Restore the most recent backup under /root/secret-backups/.
                # Used when a post-rotation smoke test fails and we need to
                # revert immediately. Does NOT reverse the api_keys
                # re-encryption — that rollback requires a separate re-run of
                # reencrypt-api-keys with OLD=new, NEW=old.
                REPO_DIR=/root/GeekSpace2.0
                SCRIPT="$REPO_DIR/ops/rotate-app-secrets.sh"
                BACKUP_DIR=/root/secret-backups
                if [ ! -x "$SCRIPT" ]; then
                  echo "ERROR: $SCRIPT missing or not executable" >&2
                  exit 1
                fi
                LATEST=$(ls -1t "$BACKUP_DIR"/agentin-secrets.*.bak 2>/dev/null | head -n1)
                if [ -z "$LATEST" ]; then
                  echo "ERROR: no backups in $BACKUP_DIR" >&2
                  exit 1
                fi
                echo "--- restoring from $LATEST ---"
                "$SCRIPT" --rollback "$LATEST"
                ;;
              *)
                echo "ERROR: unknown or unlisted action: $ACTION" >&2
                exit 1
                ;;
            esac

            echo
            echo "=== Finished:    $(date -u +%FT%TZ) ==="
        env:
          OPS_ACTION: ${{ inputs.action }}
          OPS_KEY_IDENTIFIER: ${{ inputs.key_identifier }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
