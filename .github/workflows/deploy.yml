name: Deploy

on:
  push:
    branches: [staging, live-production]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false  # Never cancel an in-progress deploy

jobs:
  # ============================================
  # CI Gate — ensure tests pass before deploy
  # ============================================
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  # ============================================
  # Deploy to Staging (staging.agentin.chat)
  # ============================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: ci-gate
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://staging.agentin.chat
    steps:
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/GeekSpace2.0

            echo "=== Pulling latest staging code ==="
            git fetch origin staging
            git checkout staging
            git pull origin staging

            echo "=== Building frontend ==="
            npm run build

            echo "=== Syncing static files ==="
            find /srv/assets/ -name "index-*" -not -name "*.css" -delete 2>/dev/null || true
            cp -r dist/assets/* /srv/assets/
            cp dist/index.html /srv/index.html
            cp -r dist/office /srv/ 2>/dev/null || true

            echo "=== Building and deploying staging container ==="
            docker compose up -d --build staging

            echo "=== Waiting for health check ==="
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3002/api/health > /dev/null 2>&1; then
                echo "Staging is healthy!"
                exit 0
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done
            echo "ERROR: Staging health check failed"
            exit 1

  # ============================================
  # Deploy to Production (ai.agentin.chat)
  # ============================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: ci-gate
    if: github.ref == 'refs/heads/live-production' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://ai.agentin.chat
    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/GeekSpace2.0

            echo "=== Pulling latest production code ==="
            git fetch origin live-production
            git checkout live-production
            git pull origin live-production

            echo "=== Building frontend ==="
            npm run build

            echo "=== Syncing static files ==="
            find /srv/assets/ -name "index-*" -not -name "*.css" -delete 2>/dev/null || true
            cp -r dist/assets/* /srv/assets/
            cp dist/index.html /srv/index.html
            cp -r dist/office /srv/ 2>/dev/null || true

            echo "=== Building and deploying production container ==="
            docker compose up -d --build geekspace

            echo "=== Waiting for health check ==="
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "Production is healthy!"
                curl -s http://localhost:3001/api/health | head -1
                exit 0
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done
            echo "ERROR: Production health check failed"
            docker compose logs --tail 20 geekspace
            exit 1

      - name: Verify production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Quick smoke test
            STATUS=$(curl -sf https://ai.agentin.chat/api/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "unreachable")
            echo "Production status: $STATUS"
            if [ "$STATUS" != "ok" ] && [ "$STATUS" != "healthy" ]; then
              echo "WARNING: Production may not be fully healthy"
            fi
