name: "Emergency Rollback"
run-name: "ROLLBACK production to ${{ inputs.commit_sha }}"

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to rollback to'
        required: true
        type: string
      skip_staging:
        description: 'Skip staging rollback (prod only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ai.agentin.chat
    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/GeekSpace2.0

            COMMIT="${{ inputs.commit_sha }}"
            echo "=== Rolling back to $COMMIT ==="

            # Verify commit exists
            git cat-file -e "$COMMIT" || { echo "ERROR: Commit $COMMIT not found"; exit 1; }

            # Reset to target commit (keep on main branch, no checkout)
            git reset --hard "$COMMIT"

            # Rebuild
            npm ci && npm --prefix server ci
            npm run build
            npm --prefix server run build

            # Deploy static files
            find /srv/assets/ -name "index-*" -not -name "*.css" -delete 2>/dev/null || true
            cp -r dist/assets/* /srv/assets/
            cp dist/index.html /srv/index.html
            cp -r dist/office /srv/ 2>/dev/null || true

            # Restart containers
            docker compose up -d --build geekspace
            if [ "${{ inputs.skip_staging }}" != "true" ]; then
              docker compose up -d --build staging
            fi

            # Health checks
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "Production healthy after rollback!"
                break
              fi
              [ "$i" -eq 30 ] && { echo "ERROR: Health check failed"; exit 1; }
              sleep 2
            done

            # Update branches
            git push origin main --force
            git push origin main:staging --force
            git push origin main:live-production --force
