name: Deploy

# ── Flow ──
# Push to main → CI passes → auto-deploy to staging
# Manual trigger → deploy to production (from whatever is on staging)

on:
  # Auto-trigger: when CI workflow completes successfully on main
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  # Manual trigger: production deploys only
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        type: choice
        options:
          - production

concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false  # Never cancel in-progress deploys

jobs:
  # ============================================
  # Auto-deploy to Staging (after CI on main)
  # ============================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: staging
      url: https://staging.agentin.chat
    steps:
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/GeekSpace2.0

            echo "=== Merging main → staging ==="
            git fetch origin main
            git checkout staging
            git merge origin/main --no-edit
            git push origin staging

            echo "=== Building frontend ==="
            npm run build

            echo "=== Building and deploying staging container ==="
            docker compose up -d --build staging

            echo "=== Waiting for health check ==="
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3002/api/health > /dev/null 2>&1; then
                echo "Staging is healthy!"
                exit 0
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done
            echo "ERROR: Staging health check failed"
            exit 1

  # ============================================
  # Deploy to Production (manual trigger only)
  # ============================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.target == 'production'
    environment:
      name: production
      url: https://ai.agentin.chat
    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/GeekSpace2.0

            echo "=== Merging staging → live-production ==="
            git fetch origin staging
            git checkout live-production
            git merge origin/staging --no-edit
            git push origin live-production

            echo "=== Building frontend ==="
            npm run build

            echo "=== Syncing static files ==="
            find /srv/assets/ -name "index-*" -not -name "*.css" -delete 2>/dev/null || true
            cp -r dist/assets/* /srv/assets/
            cp dist/index.html /srv/index.html
            cp -r dist/office /srv/ 2>/dev/null || true

            echo "=== Building and deploying production container ==="
            docker compose up -d --build geekspace

            echo "=== Waiting for health check ==="
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "Production is healthy!"
                exit 0
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done
            echo "ERROR: Production health check failed"
            docker compose logs --tail 20 geekspace
            exit 1

      - name: Verify production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            STATUS=$(curl -sf https://ai.agentin.chat/api/health | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','unknown'))" 2>/dev/null || echo "unreachable")
            echo "Production status: $STATUS"
            if [ "$STATUS" != "ok" ] && [ "$STATUS" != "healthy" ]; then
              echo "WARNING: Production may not be fully healthy"
            fi
