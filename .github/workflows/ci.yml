name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Static Checks (Lint + TypeCheck + Build)
  # ============================================
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Audit root dependencies
        run: npm audit --audit-level=critical

      - name: Audit server dependencies
        run: npm --prefix server audit --audit-level=critical

      - name: Run lint on changed files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            HEAD="HEAD"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          echo "Comparing $BASE...$HEAD"
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT $BASE $HEAD | grep -E '\.(ts|tsx|js|jsx)$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No JS/TS files changed. Skipping lint."
            exit 0
          fi

          echo "Linting changed files:"
          echo "$CHANGED_FILES"
          npx eslint --max-warnings=0 $CHANGED_FILES

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Typecheck (server)
        run: npm --prefix server run typecheck

      - name: Build frontend
        run: npm run build
        env:
          VITE_TEST_MODE: 'true'

      - name: Build server
        run: npm --prefix server run build

  # ============================================
  # Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Run server unit tests
        run: npm --prefix server run test

  # ============================================
  # E2E Tests (Playwright)
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 30
    env:
      TEST_MODE: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build
        env:
          VITE_TEST_MODE: 'true'
          VITE_API_URL: /api

      - name: Build server
        run: npm --prefix server run build

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          API_URL: http://localhost:3001
          VITE_API_TARGET: http://localhost:3001

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ============================================
  # Summary — gate for branch protection
  # ============================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [static-checks, unit-tests, e2e-tests]
    if: always()
    steps:
      - name: Check required jobs passed
        run: |
          echo "Static checks: ${{ needs.static-checks.result }}"
          echo "Unit tests:    ${{ needs.unit-tests.result }}"
          echo "E2E tests:     ${{ needs.e2e-tests.result }}"

          # Required: static-checks + unit-tests MUST pass
          if [[ "${{ needs.static-checks.result }}" != "success" ]]; then
            echo "FATAL: Static checks failed"
            exit 1
          fi

          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "FATAL: Unit tests failed"
            exit 1
          fi

          # E2E: warn but don't block
          E2E="${{ needs.e2e-tests.result }}"
          if [[ "$E2E" == "failure" ]]; then
            echo "WARNING: E2E tests failed (non-blocking)"
          fi

          echo "All required checks passed!"
