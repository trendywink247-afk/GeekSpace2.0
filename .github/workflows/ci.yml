name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target (staging deploys PR preview, production deploys main)'
        required: false
        type: choice
        options:
          - none
          - staging-only
          - production
        default: none

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Job 1: Static Checks (lint, typecheck, build, audit)
  # Runs on: PRs + pushes to main
  # ============================================
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies (including devDependencies for @types)
        run: npm --prefix server ci || npm --prefix server install
        env:
          NODE_ENV: development

      - name: Lint changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            HEAD="HEAD"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          echo "Comparing $BASE...$HEAD"
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE" "$HEAD" -- '*.ts' '*.tsx' '*.js' '*.jsx' 2>/dev/null || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No JS/TS files changed — skipping lint."
            exit 0
          fi

          echo "Linting changed files:"
          echo "$CHANGED_FILES"
          npx eslint --max-warnings=0 $CHANGED_FILES

      - name: Typecheck (root)
        run: npx tsc --noEmit

      - name: Typecheck (server)
        run: npm --prefix server run typecheck

      - name: Build frontend
        run: npx vite build
        env:
          VITE_TEST_MODE: 'true'

      - name: Build server
        run: npm --prefix server run build

      - name: Validate OpenAPI spec
        run: npx @redocly/cli lint openapi/openapi.yaml --skip-rule no-unused-components
        continue-on-error: true

      - name: Audit dependencies
        continue-on-error: true
        run: |
          npm audit --audit-level=critical || true
          npm --prefix server audit --audit-level=critical || true

  # ============================================
  # Job 2: Unit Tests (needs Job 1)
  # Runs on: PRs + pushes to main
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install server dependencies
        run: npm --prefix server ci || npm --prefix server install
        env:
          NODE_ENV: development

      - name: Run server unit tests
        run: npm --prefix server run test

      - name: Install root dependencies
        run: npm ci

      - name: Run frontend unit tests
        continue-on-error: true
        run: npm test

  # ============================================
  # Job 3: Deploy Staging Preview (needs Job 2, PRs only)
  # Preview your changes at staging.agentin.chat before merging
  # ============================================
  deploy-staging:
    name: "Deploy Staging Preview"
    runs-on: ubuntu-latest
    needs: unit-tests
    continue-on-error: true
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target != 'production')
    timeout-minutes: 10
    permissions:
      pull-requests: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://staging.agentin.chat
    steps:
      - uses: actions/checkout@v4

      - name: Deploy PR to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -e
            cd ~/GeekSpace2.0

            echo "=== Cleaning local changes ==="
            git stash --include-untracked || true

            BRANCH="${{ github.head_ref || 'main' }}"
            echo "=== Fetching branch: $BRANCH ==="
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull origin "$BRANCH"

            echo "=== Building & deploying staging container ==="
            DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 \
              docker compose up -d --build staging

            echo "=== Health check (staging :3002) ==="
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3002/api/health > /dev/null 2>&1; then
                echo "Staging is healthy!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            if ! curl -sf http://localhost:3002/api/health > /dev/null 2>&1; then
              echo "ERROR: Staging health check failed"
              docker compose logs --tail 20 staging
              exit 1
            fi

            echo "=== Switching back to main ==="
            git checkout main

            echo "=== Staging preview ready ==="
            echo "Preview at: https://staging.agentin.chat"

      - name: Comment staging URL on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const body = `🚀 **Staging deployed!** Preview your changes at:\n👉 https://staging.agentin.chat\n\n_Auto-deployed from this PR. Will be replaced when the next PR deploys._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Staging deployed!'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ============================================
  # Job 4: Deploy Production (needs Job 2, push to main only)
  # Only runs when PR is merged to main
  # ============================================
  deploy-production:
    name: "Deploy Production"
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production'
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://ai.agentin.chat
    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -e
            cd ~/GeekSpace2.0

            echo "=== Cleaning local changes ==="
            git stash --include-untracked || true

            echo "=== Pulling latest main ==="
            git pull origin main
            GIT_SHA=$(git rev-parse --short HEAD)
            echo "Deploying commit: $GIT_SHA"

            echo "=== Tagging previous image for rollback ==="
            docker tag geekspace2.0-geekspace:latest geekspace2.0-geekspace:previous 2>/dev/null || true

            echo "=== Building production container (BuildKit cache) ==="
            DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 \
              docker compose build --build-arg GIT_SHA=$GIT_SHA geekspace

            echo "=== Deploying production container ==="
            docker compose up -d geekspace

            echo "=== Syncing static files to Caddy ==="
            docker cp geekspace-app:/app/dist/assets/. /srv/assets/
            docker cp geekspace-app:/app/dist/index.html /srv/index.html
            docker cp geekspace-app:/app/dist/office /srv/office 2>/dev/null || true

            echo "=== Health check (production :3001) ==="
            HEALTHY=false
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "Production is healthy!"
                HEALTHY=true
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "ERROR: Health check failed — rolling back to previous image"
              docker compose logs --tail 30 geekspace
              docker tag geekspace2.0-geekspace:previous geekspace2.0-geekspace:latest 2>/dev/null || true
              docker compose up -d geekspace
              sleep 5
              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "Rollback successful — previous version restored"
              else
                echo "CRITICAL: Rollback also failed"
              fi
              exit 1
            fi

            echo "=== Also update staging to match production ==="
            DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 \
              docker compose up -d --build staging

            echo "=== Verifying public URL ==="
            if curl -sf https://ai.agentin.chat/api/health > /dev/null 2>&1; then
              echo "Production is live at https://ai.agentin.chat (commit: $GIT_SHA)"
            else
              echo "WARNING: Public URL check failed (Caddy may still be propagating)"
            fi

            echo "=== Pruning old images ==="
            docker image prune -f --filter "until=72h" 2>/dev/null || true

  # ============================================
  # Summary — required status check for branch protection
  # Always runs so the check is reported even on failure
  # ============================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [static-checks, unit-tests]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.static-checks.result }}" != "success" ]; then
            echo "Static checks failed"
            exit 1
          fi
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "Unit tests failed"
            exit 1
          fi
          echo "All checks passed"

      - name: Write summary
        if: always()
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Static Checks | ${{ needs.static-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Job 6: Promote Branches (needs deploy-production)
  # ============================================
  promote-branches:
    name: "Promote Branches"
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote main to tracking branches
        run: |
          git push origin HEAD:staging --force
          git push origin HEAD:live-production --force
          echo "All branches synced to main."
