name: CI

on:
  push:
    branches: [main, master, live-production]
  pull_request:
    branches: [main, master, live-production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Static Checks (Lint + TypeCheck)
  # ============================================
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install root dependencies
      - name: Install root dependencies
        run: npm ci

      # Install server dependencies
      - name: Install server dependencies
        run: npm --prefix server ci

      # Install picoclaw dependencies (if exists)
      - name: Install picoclaw dependencies
        if: hashFiles('picoclaw/package-lock.json') != ''
        run: npm --prefix picoclaw ci

      # Install bridge dependencies (if exists)
      - name: Install bridge dependencies
        if: hashFiles('bridge/edith-bridge/package-lock.json') != ''
        run: npm --prefix bridge/edith-bridge ci

      # Install smoke test dependencies (if exists)
      - name: Install smoke test dependencies
        if: hashFiles('scripts/smoke/package-lock.json') != ''
        run: npm --prefix scripts/smoke ci

      # Run lint on changed files only
      - name: Run lint on changed files
        run: |
          # Determine the base and head for comparison
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            HEAD="HEAD"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          echo "Comparing $BASE...$HEAD"

          # Get changed JS/TS files
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT $BASE $HEAD | grep -E '\.(ts|tsx|js|jsx)$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No JS/TS files changed. Skipping lint."
            exit 0
          fi

          echo "Linting changed files:"
          echo "$CHANGED_FILES"

          # Run eslint on changed files
          npx eslint --max-warnings=0 $CHANGED_FILES

      # Run typecheck on root
      - name: Run typecheck (root)
        run: npm run typecheck

      # Run typecheck on server
      - name: Run typecheck (server)
        run: npm --prefix server run typecheck

      # Run build on root
      - name: Run build (root)
        run: npm run build
        env:
          VITE_TEST_MODE: 'true'

      # Run build on server
      - name: Run build (server)
        run: npm --prefix server run build

  # ============================================
  # Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies
      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      # Run frontend unit tests (if any exist)
      - name: Run frontend unit tests
        run: npm run test || echo "No frontend tests configured"

      # Run server unit tests
      - name: Run server unit tests
        run: npm --prefix server run test

  # ============================================
  # E2E Tests (Playwright)
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 60
    env:
      TEST_MODE: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies
      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      # Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Build the application
      - name: Build frontend
        run: npm run build
        env:
          VITE_TEST_MODE: 'true'
          VITE_API_URL: /api

      - name: Build server
        run: npm --prefix server run build

      # Run Playwright tests
      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          API_URL: http://localhost:3001
          VITE_API_TARGET: http://localhost:3001

      # Upload test results on failure
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Upload screenshots on failure
      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-results/**/*.png
          retention-days: 7

  # ============================================
  # Smoke Tests
  # ============================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, e2e-tests]
    timeout-minutes: 10
    env:
      TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies
      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Install smoke test dependencies
        if: hashFiles('scripts/smoke/package-lock.json') != ''
        run: npm --prefix scripts/smoke ci

      # Build the application
      - name: Build server
        run: npm --prefix server run build

      # Start server in background
      - name: Start server
        run: |
          cd server
          TEST_MODE=1 PORT=3001 node dist/index.js &
          echo $! > /tmp/server.pid
          # Wait for server to be ready
          npx wait-on http://localhost:3001/api/health --timeout 60000

      # Run smoke tests
      - name: Run smoke tests
        run: npm --prefix scripts/smoke run smoke
        env:
          API_URL: http://localhost:3001

      # Stop server
      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) || true
          fi

  # ============================================
  # Summary
  # ============================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [static-checks, unit-tests, e2e-tests, smoke-tests]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Static checks: ${{ needs.static-checks.result }}"
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "E2E tests: ${{ needs.e2e-tests.result }}"
          echo "Smoke tests: ${{ needs.smoke-tests.result }}"

          if [[ "${{ needs.static-checks.result }}" == "success" && \
                "${{ needs.unit-tests.result }}" == "success" && \
                "${{ needs.e2e-tests.result }}" == "success" && \
                "${{ needs.smoke-tests.result }}" == "success" ]]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Some checks failed"
            exit 1
          fi
