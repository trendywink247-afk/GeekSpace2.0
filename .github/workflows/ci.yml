name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target (staging deploys main, production deploys main)'
        required: false
        type: choice
        options:
          - none
          - staging-only
          - production
        default: none

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ============================================
  # Job 1: Static Checks (lint, typecheck, build, audit)
  # Runs on: PRs + pushes to main
  # ============================================
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies (including devDependencies for @types)
        run: npm --prefix server ci
        env:
          NODE_ENV: development

      - name: Lint changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            HEAD="HEAD"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          echo "Comparing $BASE...$HEAD"
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE" "$HEAD" -- '*.ts' '*.tsx' '*.js' '*.jsx' 2>/dev/null || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No JS/TS files changed — skipping lint."
            exit 0
          fi

          echo "Linting changed files:"
          echo "$CHANGED_FILES"
          npx eslint --max-warnings=0 $CHANGED_FILES

      - name: Typecheck (root)
        run: npx tsc --noEmit

      - name: Typecheck (server)
        run: npm --prefix server run typecheck

      - name: Build frontend
        run: npx vite build
        env:
          VITE_TEST_MODE: 'true'

      - name: Build server
        run: npm --prefix server run build

      - name: Validate Caddyfile (only if changed)
        run: |
          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null | grep -q '^caddy/Caddyfile$'; then
            echo "caddy/Caddyfile changed — validating..."
            curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_linux_amd64.tar.gz" \
              | tar -xz -C /tmp caddy
            sudo install /tmp/caddy /usr/local/bin/caddy
            caddy validate --config caddy/Caddyfile --adapter caddyfile
          else
            echo "caddy/Caddyfile not changed — skipping validation."
          fi
        env:
          BEFORE_SHA: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          AFTER_SHA: ${{ github.event_name == 'pull_request' && 'HEAD' || github.sha }}

      - name: Validate OpenAPI spec
        run: npx @redocly/cli lint openapi/openapi.yaml --skip-rule no-unused-components
        continue-on-error: true

      - name: Audit dependencies
        continue-on-error: true
        run: |
          npm audit --audit-level=critical || true
          npm --prefix server audit --audit-level=critical || true

      - name: Security scan (gitleaks — secrets in commits)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep SAST scan
        continue-on-error: true
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/typescript
            p/nodejs
            p/react

  # ============================================
  # Job 2: Unit Tests (needs Job 1)
  # Runs on: PRs + pushes to main
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install server dependencies
        run: npm --prefix server ci
        env:
          NODE_ENV: development

      - name: Run server unit tests
        run: npm --prefix server run test

      - name: Install root dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

  # ============================================
  # Job 2.5: E2E Tests (Playwright)
  # Runs on: PRs + pushes to main
  # Uses pre-built frontend + server
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    continue-on-error: true  # E2E failures don't block deploy (yet); remove when stable
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci
        env:
          NODE_ENV: development

      - name: Build server
        run: npm --prefix server run build

      - name: Validate Caddyfile (only if changed)
        run: |
          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null | grep -q '^caddy/Caddyfile$'; then
            echo "caddy/Caddyfile changed — validating..."
            curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_linux_amd64.tar.gz" \
              | tar -xz -C /tmp caddy
            sudo install /tmp/caddy /usr/local/bin/caddy
            caddy validate --config caddy/Caddyfile --adapter caddyfile
          else
            echo "caddy/Caddyfile not changed — skipping validation."
          fi
        env:
          BEFORE_SHA: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          AFTER_SHA: ${{ github.event_name == 'pull_request' && 'HEAD' || github.sha }}

      - name: Build frontend
        run: npm run build
        env:
          VITE_TEST_MODE: 'true'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (chromium only in CI)
        run: npx playwright test --project=chromium --reporter=list,junit
        env:
          CI: 'true'
          TEST_MODE: 'true'
          JWT_SECRET: 'ci-test-secret-not-for-production'
          ENCRYPTION_KEY: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          DB_PATH: '/tmp/e2e-test.db'
          NODE_ENV: 'test'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-junit
          path: test-results/junit.xml
          retention-days: 7

  # ============================================
  # Job 3: Deploy Staging (needs Job 2, push to main only)
  # Auto-deploys to staging.agentin.chat on merge to main
  # ============================================
  deploy-staging:
    name: "Deploy Staging"
    runs-on: ubuntu-latest
    needs: unit-tests
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'staging-only')
    timeout-minutes: 10
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    steps:
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -e
            cd ~/GeekSpace2.0

            echo "=== Cleaning local changes ==="
            git stash --include-untracked || true

            echo "=== Pulling latest main ==="
            git fetch origin main
            git checkout main
            git pull origin main

            echo "=== Building frontend bundle into dist/ ==="
            # 2026-04-06: Caddy serves the SPA from /srv on the host,
            # NOT from /app/dist inside the container. We must build the
            # frontend on the host and rsync to /srv before (or after)
            # rebuilding the container, otherwise frontend changes never
            # reach users even though the API container has new code.
            # See commit 0742e04b for the debug session that found this.
            npm ci
            npx vite build
            echo "=== Syncing dist/ -> /srv (Caddy static root) ==="
            rsync -a --delete dist/ /srv/

            echo "=== Building & deploying staging container ==="
            DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 \
              docker compose up -d --build staging

            echo "=== Health check (staging :3002) ==="
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3002/api/health > /dev/null 2>&1; then
                echo "Staging is healthy!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            if ! curl -sf http://localhost:3002/api/health > /dev/null 2>&1; then
              echo "ERROR: Staging health check failed"
              docker compose logs --tail 20 staging
              exit 1
            fi

            echo "=== Staging deployed ==="
            echo "Live at: https://staging.agentin.chat"

  # ============================================
  # Job 4: Deploy Production (needs Job 2, manual dispatch only)
  # Only runs when manually triggered with deploy_target == 'production'
  # ============================================
  deploy-production:
    name: "Deploy Production"
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production'
    timeout-minutes: 10
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    environment:
      name: production
      url: https://ai.agentin.chat
    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -e
            cd ~/GeekSpace2.0

            echo "=== Cleaning local changes ==="
            git stash --include-untracked || true

            echo "=== Pulling latest main ==="
            git pull origin main
            GIT_SHA=$(git rev-parse --short HEAD)
            echo "Deploying commit: $GIT_SHA"

            echo "=== Tagging previous image for rollback ==="
            docker tag geekspace2.0-geekspace:latest geekspace2.0-geekspace:previous 2>/dev/null || true

            echo "=== Building production container (BuildKit cache) ==="
            DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 \
              docker compose build --build-arg GIT_SHA=$GIT_SHA geekspace

            echo "=== Deploying production container ==="
            docker compose up -d geekspace

            echo "=== Syncing static files to Caddy ==="
            docker cp geekspace-app:/app/dist/assets/. /srv/assets/
            docker cp geekspace-app:/app/dist/index.html /srv/index.html
            docker cp geekspace-app:/app/dist/office /srv/office 2>/dev/null || true

            echo "=== Health check (production :3001) ==="
            HEALTHY=false
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "Production is healthy!"
                HEALTHY=true
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "ERROR: Health check failed — rolling back to previous image"
              docker compose logs --tail 30 geekspace
              docker tag geekspace2.0-geekspace:previous geekspace2.0-geekspace:latest 2>/dev/null || true
              docker compose up -d geekspace
              sleep 5
              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "Rollback successful — previous version restored"
              else
                echo "CRITICAL: Rollback also failed"
              fi
              exit 1
            fi

            echo "=== Also update staging to match production ==="
            DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 \
              docker compose up -d --build staging

            echo "=== Verifying public URL ==="
            if curl -sf https://ai.agentin.chat/api/health > /dev/null 2>&1; then
              echo "Production is live at https://ai.agentin.chat (commit: $GIT_SHA)"
            else
              echo "WARNING: Public URL check failed (Caddy may still be propagating)"
            fi

            echo "=== Pruning old images ==="
            docker image prune -f --filter "until=72h" 2>/dev/null || true

  # ============================================
  # Summary — required status check for branch protection
  # Always runs so the check is reported even on failure
  # ============================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [static-checks, unit-tests, e2e-tests]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.static-checks.result }}" != "success" ]; then
            echo "Static checks failed"
            exit 1
          fi
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "Unit tests failed"
            exit 1
          fi
          echo "All checks passed"

      - name: Write summary
        if: always()
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Static Checks | ${{ needs.static-checks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Job 6: Promote Branches (needs deploy-production)
  # ============================================
  promote-branches:
    name: "Promote Branches"
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Promote main to tracking branches
        run: |
          git push origin HEAD:staging --force
          git push origin HEAD:live-production --force
          echo "All branches synced to main."
