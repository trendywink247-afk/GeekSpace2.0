name: CI/CD Pipeline

# ---------------------------------------------------------------------------
# 2026-04-18 — AGE-22: E2E + security-scans are now merge-gating.
#
# Previous layout treated E2E and security-scans as informational
# (continue-on-error + excluded from Summary `needs:`). An audit of the last
# 26 CI runs showed both were 100% green; the continue-on-error flag was
# masking real failures in broken sub-gates (OpenAPI spec lint, npm audit).
# See AGE-22 for the full classification.
#
#   ┌─ lint-and-typecheck   (1-2m) ─┐
#   ├─ build-frontend       (1-2m) ─┤
#   ├─ build-server         (1m)   ─┤
#   ├─ unit-tests-frontend  (1-2m) ─┼─→ Summary  (merge-gating)
#   ├─ unit-tests-server    (1-2m) ─┤
#   ├─ e2e-tests            (5-6m) ─┤
#   └─ security-scans       (3-4m) ─┘
#
# Notes:
#   * Summary now waits on E2E + security, so the critical path is ~6 min.
#   * Playwright browsers are cached.
#   * Docs-only PRs (*.md, etc.) skip CI entirely via paths-ignore.
#   * AGE-34 fixed the OpenAPI spec (nullable → 3.1 unions); AGE-35 made
#     `npm audit` a real hard gate (dropped `|| true`, resolved root +
#     server protobufjs CVE). No step-level continue-on-error remains.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target (staging deploys main, production deploys main)'
        required: false
        type: choice
        options:
          - none
          - staging-only
          - production
        default: none

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ============================================
  # Lint + Typecheck (frontend + server)
  # ============================================
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # needed for `git diff base...head` lint scoping

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci
        env:
          NODE_ENV: development

      - name: Lint changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            HEAD="HEAD"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          echo "Comparing $BASE...$HEAD"
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE" "$HEAD" -- '*.ts' '*.tsx' '*.js' '*.jsx' 2>/dev/null || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No JS/TS files changed — skipping lint."
            exit 0
          fi

          echo "Linting changed files:"
          echo "$CHANGED_FILES"
          npx eslint --max-warnings=0 $CHANGED_FILES

      - name: Typecheck (root)
        run: npx tsc --noEmit

      - name: Typecheck (server)
        run: npm --prefix server run typecheck

  # ============================================
  # Build frontend
  # ============================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build
        env:
          VITE_TEST_MODE: 'true'

  # ============================================
  # Build server
  # ============================================
  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm --prefix server ci
        env:
          NODE_ENV: development

      - name: Build server
        run: npm --prefix server run build

  # ============================================
  # Frontend unit tests
  # ============================================
  unit-tests-frontend:
    name: Unit Tests (Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm test

  # ============================================
  # Server unit tests
  # ============================================
  unit-tests-server:
    name: Unit Tests (Server)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm --prefix server ci
        env:
          NODE_ENV: development

      - name: Run server unit tests
        run: npm --prefix server run test

  # ============================================
  # E2E Tests (Playwright) — gating since AGE-22 (stable, 26/26 green).
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci
        env:
          NODE_ENV: development

      - name: Build server
        run: npm --prefix server run build

      - name: Build frontend
        run: npm run build
        env:
          VITE_TEST_MODE: 'true'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests (chromium only in CI)
        run: npx playwright test --project=chromium --reporter=list,junit
        env:
          CI: 'true'
          TEST_MODE: 'true'
          JWT_SECRET: 'ci-test-secret-not-for-production'
          ENCRYPTION_KEY: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          DB_PATH: '/tmp/e2e-test.db'
          NODE_ENV: 'test'

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-junit
          path: test-results/junit.xml
          retention-days: 7

  # ============================================
  # Security & supply-chain scans.
  #
  # AGE-22 audit (26 CI runs):
  #   - Validate Caddyfile  → 100% pass (skipped when file unchanged). GATING.
  #   - Validate OpenAPI    → spec fixed under AGE-34 (18 nullable errors
  #                           rewritten as 3.1 type unions). Step-level
  #                           continue-on-error removed; lint is now a hard
  #                           step under this job.
  #   - Audit dependencies  → hard gate under AGE-35 (`|| true` removed, root
  #                           + server protobufjs CVE resolved to 7.5.5).
  #   - gitleaks            → 100% pass. GATING.
  #   - Semgrep             → 100% pass. GATING. (AGE-39 cleared the 26
  #                           pre-existing findings — each either fixed or
  #                           suppressed with a per-finding `// nosemgrep:
  #                           <rule-id> — <reason>` annotation. New findings
  #                           block the job.)
  # ============================================
  security-scans:
    name: Security Scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # gitleaks needs history

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Validate Caddyfile (only if changed)
        run: |
          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null | grep -q '^caddy/Caddyfile$'; then
            echo "caddy/Caddyfile changed — validating..."
            curl -fsSL "https://github.com/caddyserver/caddy/releases/download/v2.8.4/caddy_2.8.4_linux_amd64.tar.gz" \
              | tar -xz -C /tmp caddy
            sudo install /tmp/caddy /usr/local/bin/caddy
            caddy validate --config caddy/Caddyfile --adapter caddyfile
          else
            echo "caddy/Caddyfile not changed — skipping validation."
          fi
        env:
          BEFORE_SHA: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          AFTER_SHA: ${{ github.event_name == 'pull_request' && 'HEAD' || github.sha }}

      - name: Validate OpenAPI spec
        run: npx @redocly/cli lint openapi/openapi.yaml --skip-rule no-unused-components

      # if: always() on the remaining scans so an OpenAPI lint failure (now a
      # hard step under AGE-34) does not short-circuit the other security
      # results for that commit. Each scan still reports its own pass/fail.
      - name: Audit dependencies
        if: always()
        run: |
          npm audit --audit-level=critical
          npm --prefix server audit --audit-level=critical

      - name: Security scan (gitleaks — secrets in commits)
        if: always()
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Semgrep SAST is a required gate. AGE-39 cleared the prior 26 findings
      # (each either fixed or suppressed with per-finding `nosemgrep: <rule-id>`
      # plus a rationale). New findings block the job.
      - name: Semgrep SAST scan
        if: always()
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/typescript
            p/nodejs
            p/react

  # ============================================
  # Deploy Staging — runs on push to main, after the required checks pass
  # ============================================
  deploy-staging:
    name: "Deploy Staging"
    runs-on: ubuntu-latest
    # `summary` transitively depends on E2E + security-scans, so this keeps
    # deploys from racing the new gates (AGE-22).
    needs: [summary]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'staging-only')
    timeout-minutes: 10
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    steps:
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -e
            cd ~/GeekSpace2.0
            DEPLOY_START=$(date +%s)

            echo "=== Cleaning local changes ==="
            git merge --abort 2>/dev/null || true
            git rebase --abort 2>/dev/null || true
            git checkout -f main
            git reset --hard origin/main
            git clean -fd

            echo "=== Pulling latest main ==="
            git fetch origin main
            git reset --hard origin/main
            GIT_SHA=$(git rev-parse --short HEAD)

            echo "=== Tagging previous staging image for rollback ==="
            docker tag geekspace2.0-staging:latest geekspace2.0-staging:previous 2>/dev/null || true

            echo "=== Building frontend bundle into dist/ ==="
            npm ci
            npx vite build
            echo "=== Syncing dist/ -> /srv/staging (Caddy static root) ==="
            mkdir -p /srv/staging
            rsync -a --delete dist/ /srv/staging/

            echo "=== Building & deploying staging container ==="
            DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 \
              docker compose up -d --build staging

            echo "=== Health check (staging :3002) ==="
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3002/api/health > /dev/null 2>&1; then
                echo "Staging is healthy!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            if ! curl -sf http://localhost:3002/api/health > /dev/null 2>&1; then
              echo "ERROR: Staging health check failed — rolling back"
              docker compose logs --tail 20 staging
              docker tag geekspace2.0-staging:previous geekspace2.0-staging:latest 2>/dev/null || true
              docker compose up -d staging
              exit 1
            fi

            echo "=== Smoke: verifying deployed commit ==="
            STAGED_COMMIT=$(curl -sf http://localhost:3002/api/health/version \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit','unknown'))" 2>/dev/null \
              || echo "unknown")
            if [ "$STAGED_COMMIT" != "$GIT_SHA" ]; then
              echo "ERROR: Smoke test failed — app reports commit '$STAGED_COMMIT', expected '$GIT_SHA'"
              docker compose logs --tail 20 staging
              echo "=== Rolling back to previous staging image ==="
              docker tag geekspace2.0-staging:previous geekspace2.0-staging:latest 2>/dev/null || true
              docker compose up -d staging
              exit 1
            fi
            echo "Smoke passed — commit $STAGED_COMMIT confirmed live"

            DEPLOY_END=$(date +%s)
            DEPLOY_DURATION=$((DEPLOY_END - DEPLOY_START))
            echo "=== Deploy duration: ${DEPLOY_DURATION}s ==="
            # Emit to Prometheus textfile collector (read by node_exporter if configured).
            TEXTFILE_DIR="/var/lib/prometheus/textfile_collector"
            mkdir -p "$TEXTFILE_DIR" 2>/dev/null || true
            echo "deploy_staging_last_duration_seconds $DEPLOY_DURATION" > "$TEXTFILE_DIR/deploy_staging.prom" 2>/dev/null || true

            echo "=== Staging deployed ==="
            echo "Live at: https://staging.agentin.chat"

  # ============================================
  # Deploy Production — manual dispatch only
  # ============================================
  deploy-production:
    name: "Deploy Production"
    runs-on: ubuntu-latest
    # `summary` transitively depends on E2E + security-scans, so this keeps
    # deploys from racing the new gates (AGE-22).
    needs: [summary]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production'
    timeout-minutes: 10
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    environment:
      name: production
      url: https://ai.agentin.chat
    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -e
            cd ~/GeekSpace2.0

            echo "=== Checking for dirty working tree ==="
            # Abort any stuck merge/rebase first
            git merge --abort 2>/dev/null || true
            git rebase --abort 2>/dev/null || true
            # Fail loudly if there are local edits — someone is probably debugging
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "ERROR: deploy host working tree is dirty. Refusing to deploy."
              git status --short
              exit 1
            fi

            echo "=== Pulling latest main ==="
            git fetch origin main
            git checkout -f main
            git reset --hard origin/main
            GIT_SHA=$(git rev-parse --short HEAD)
            GIT_SHA_FULL=$(git rev-parse HEAD)
            echo "Deploying commit: $GIT_SHA"

            echo "=== Tagging previous image for rollback ==="
            docker tag geekspace2.0-geekspace:latest geekspace2.0-geekspace:previous 2>/dev/null || true

            echo "=== Building frontend bundle on host (BEFORE container restart) ==="
            # Same fix as staging deploy (commit 0742e04b): Caddy serves the SPA
            # from /srv on the host, NOT from /app/dist inside the container.
            # We must build the frontend on the host and rsync to /srv with
            # --delete so old hashed bundles don't accumulate, and we must do
            # this BEFORE restarting the container so users never see a window
            # of new-API + old-assets (or vice versa).
            npm ci
            npx vite build

            echo "=== Syncing dist/ -> /srv/prod (Caddy static root, with --delete) ==="
            mkdir -p /srv/prod
            rsync -a --delete dist/ /srv/prod/

            echo "=== Building production container (BuildKit cache) ==="
            DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 \
              docker compose build --build-arg GIT_SHA=$GIT_SHA geekspace

            echo "=== Deploying production container ==="
            docker compose up -d geekspace

            echo "=== Health check (production :3001) ==="
            HEALTHY=false
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "Production is healthy!"
                HEALTHY=true
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "ERROR: Health check failed — rolling back to previous image"
              docker compose logs --tail 30 geekspace
              docker tag geekspace2.0-geekspace:previous geekspace2.0-geekspace:latest 2>/dev/null || true
              docker compose up -d geekspace
              sleep 5
              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "Rollback successful — previous version restored"
              else
                echo "CRITICAL: Rollback also failed"
              fi
              exit 1
            fi

            echo "=== Smoke: verifying deployed commit ==="
            PROD_COMMIT=$(curl -sf http://localhost:3001/api/health/version \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('commit','unknown'))" 2>/dev/null \
              || echo "unknown")
            if [ "$PROD_COMMIT" != "$GIT_SHA" ]; then
              echo "ERROR: Smoke test failed — app reports commit '$PROD_COMMIT', expected '$GIT_SHA'"
              docker compose logs --tail 30 geekspace
              echo "=== Rolling back to previous image ==="
              docker tag geekspace2.0-geekspace:previous geekspace2.0-geekspace:latest 2>/dev/null || true
              docker compose up -d geekspace
              sleep 5
              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "Rollback successful"
              else
                echo "CRITICAL: Rollback also failed"
              fi
              exit 1
            fi
            echo "Smoke passed — commit $PROD_COMMIT confirmed live"

            echo "=== Tagging this commit as deployed-production ==="
            # Lightweight git tag so 'what's live in prod' is one command away:
            #   git fetch --tags && git describe --tags --match 'prod-*' --abbrev=0
            TAG="prod-$(date -u +%Y%m%d-%H%M%S)-${GIT_SHA}"
            git tag -f "$TAG" "$GIT_SHA_FULL" || true
            git push origin "$TAG" || echo "WARNING: failed to push tag $TAG"

            # NOTE: deliberately NOT rebuilding staging here. Staging is meant
            # to be AHEAD of production — rebuilding it on prod-deploy would
            # silently regress every PR that's landed on main since the last
            # prod cut. If you need staging to mirror prod, run the
            # 'staging-only' workflow_dispatch instead.

            echo "=== Verifying public URL ==="
            if curl -sf https://ai.agentin.chat/api/health > /dev/null 2>&1; then
              echo "Production is live at https://ai.agentin.chat (commit: $GIT_SHA)"
            else
              echo "WARNING: Public URL check failed (Caddy may still be propagating)"
            fi

            echo "=== Pruning old images ==="
            docker image prune -f --filter "until=72h" 2>/dev/null || true

  # ============================================
  # Summary — required status check for branch protection.
  #
  # AGE-22: E2E and security-scans now gate merges. Previously they ran with
  # `continue-on-error: true` and were excluded from `needs:`, which meant a
  # failing E2E or security job was indistinguishable from a passing one.
  # Over the last 26 CI runs both were green; any regression from here on is
  # a real regression and should block the merge.
  # ============================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - build-frontend
      - build-server
      - unit-tests-frontend
      - unit-tests-server
      - e2e-tests
      - security-scans
    if: always()
    steps:
      - name: Check results
        run: |
          FAILED=0
          for job in lint-and-typecheck build-frontend build-server unit-tests-frontend unit-tests-server e2e-tests security-scans; do
            case "$job" in
              lint-and-typecheck) result="${{ needs.lint-and-typecheck.result }}" ;;
              build-frontend) result="${{ needs.build-frontend.result }}" ;;
              build-server) result="${{ needs.build-server.result }}" ;;
              unit-tests-frontend) result="${{ needs.unit-tests-frontend.result }}" ;;
              unit-tests-server) result="${{ needs.unit-tests-server.result }}" ;;
              e2e-tests) result="${{ needs.e2e-tests.result }}" ;;
              security-scans) result="${{ needs.security-scans.result }}" ;;
            esac
            if [ "$result" != "success" ]; then
              echo "❌ $job: $result"
              FAILED=1
            else
              echo "✅ $job: $result"
            fi
          done
          if [ "$FAILED" = "1" ]; then
            exit 1
          fi
          echo "All required checks passed."

      - name: Write summary
        if: always()
        run: |
          {
            echo "## CI Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| Lint & Typecheck      | ${{ needs.lint-and-typecheck.result }} |"
            echo "| Build Frontend        | ${{ needs.build-frontend.result }} |"
            echo "| Build Server          | ${{ needs.build-server.result }} |"
            echo "| Unit Tests (Frontend) | ${{ needs.unit-tests-frontend.result }} |"
            echo "| Unit Tests (Server)   | ${{ needs.unit-tests-server.result }} |"
            echo "| E2E Tests             | ${{ needs.e2e-tests.result }} |"
            echo "| Security Scans        | ${{ needs.security-scans.result }} |"
          } >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Notify on red main — Telegram ping when any job fails on main.
  # AGE-45: keeps the same curl pattern as ~/.claude/hooks/notify-telegram.sh
  #         on the VPS host to avoid reinventing notification logic.
  # ============================================
  notify-failure:
    name: "Notify: red main"
    runs-on: ubuntu-latest
    needs: [summary]
    if: |
      failure() && github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    steps:
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set — skipping notification"
            exit 0
          fi
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          MSG="🔴 CI failed on <b>main</b>%0A%0ACommit: <code>${SHORT_SHA}</code>%0ARun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sf \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&parse_mode=HTML&text=${MSG}" \
            > /dev/null

  # ============================================
  # Promote Branches — after production deploy
  # ============================================
  promote-branches:
    name: "Promote Branches"
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_target == 'production'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Promote main to tracking branches
        run: |
          git push origin HEAD:staging --force
          git push origin HEAD:live-production --force
          echo "All branches synced to main."
