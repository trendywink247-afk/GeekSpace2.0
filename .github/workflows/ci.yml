name: CI

on:
  push:
    branches: [main, dev, staging, live-production]
  pull_request:
    branches: [main, dev, staging, live-production]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ============================================
  # Static Checks (Lint + TypeCheck + Build)
  # ============================================
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Install picoclaw dependencies
        if: hashFiles('picoclaw/package-lock.json') != ''
        run: npm --prefix picoclaw ci

      - name: Install bridge dependencies
        if: hashFiles('bridge/edith-bridge/package-lock.json') != ''
        run: npm --prefix bridge/edith-bridge ci

      # Security audit — blocks on critical vulnerabilities
      - name: Audit root dependencies
        run: npm audit --audit-level=critical

      - name: Audit server dependencies
        run: npm --prefix server audit --audit-level=critical

      # Lint changed files only (faster than full lint)
      - name: Run lint on changed files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            HEAD="HEAD"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          echo "Comparing $BASE...$HEAD"
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT $BASE $HEAD | grep -E '\.(ts|tsx|js|jsx)$' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No JS/TS files changed. Skipping lint."
            exit 0
          fi

          echo "Linting changed files:"
          echo "$CHANGED_FILES"
          npx eslint --max-warnings=0 $CHANGED_FILES

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Typecheck (server)
        run: npm --prefix server run typecheck

      - name: Build frontend
        run: npm run build
        env:
          VITE_TEST_MODE: 'true'

      - name: Build server
        run: npm --prefix server run build

  # ============================================
  # Unit Tests
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Run frontend unit tests
        run: npm run test || echo "No frontend tests configured"

      - name: Run server unit tests
        run: npm --prefix server run test

  # ============================================
  # E2E Tests (Playwright)
  # Playwright config manages server lifecycle
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 30
    env:
      TEST_MODE: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build
        env:
          VITE_TEST_MODE: 'true'
          VITE_API_URL: /api

      - name: Build server
        run: npm --prefix server run build

      # Playwright webServer config handles starting/stopping the server
      # No manual server start needed — playwright.config.ts defines webServer
      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          API_URL: http://localhost:3001
          VITE_API_TARGET: http://localhost:3001

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

  # ============================================
  # Smoke Tests (independent of E2E)
  # ============================================
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 10
    if: hashFiles('scripts/smoke/package-lock.json') != ''
    env:
      TEST_MODE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Install smoke test dependencies
        run: npm --prefix scripts/smoke ci

      - name: Build server
        run: npm --prefix server run build

      - name: Start server
        run: |
          cd server
          TEST_MODE=1 PORT=3001 node dist/index.js &
          echo $! > /tmp/server.pid
          npx wait-on http://localhost:3001/api/health --timeout 60000

      - name: Run smoke tests
        run: npm --prefix scripts/smoke run smoke
        env:
          API_URL: http://localhost:3001

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/server.pid ]; then
            kill $(cat /tmp/server.pid) || true
          fi

  # ============================================
  # Summary — gate for branch protection
  # ============================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [static-checks, unit-tests, e2e-tests, smoke-tests]
    if: always()
    steps:
      - name: Check required jobs passed
        run: |
          echo "Static checks: ${{ needs.static-checks.result }}"
          echo "Unit tests:    ${{ needs.unit-tests.result }}"
          echo "E2E tests:     ${{ needs.e2e-tests.result }}"
          echo "Smoke tests:   ${{ needs.smoke-tests.result }}"
          echo ""

          # Required: static-checks + unit-tests MUST pass
          if [[ "${{ needs.static-checks.result }}" != "success" ]]; then
            echo "FATAL: Static checks failed"
            exit 1
          fi

          if [[ "${{ needs.unit-tests.result }}" != "success" ]]; then
            echo "FATAL: Unit tests failed"
            exit 1
          fi

          # E2E: must pass or be skipped (not failure)
          E2E="${{ needs.e2e-tests.result }}"
          if [[ "$E2E" == "failure" ]]; then
            echo "WARNING: E2E tests failed"
            exit 1
          fi

          # Smoke: allowed to skip (conditional job)
          SMOKE="${{ needs.smoke-tests.result }}"
          if [[ "$SMOKE" == "failure" ]]; then
            echo "WARNING: Smoke tests failed"
            exit 1
          fi

          echo "All required checks passed!"
