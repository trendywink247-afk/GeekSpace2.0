name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Job 1: Static Checks (lint, typecheck, build, audit)
  # ============================================
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Lint changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            HEAD="HEAD"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          echo "Comparing $BASE...$HEAD"
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE" "$HEAD" -- '*.ts' '*.tsx' '*.js' '*.jsx' 2>/dev/null || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No JS/TS files changed — skipping lint."
            exit 0
          fi

          echo "Linting changed files:"
          echo "$CHANGED_FILES"
          npx eslint --max-warnings=0 $CHANGED_FILES

      - name: Typecheck (root)
        run: npx tsc --noEmit

      - name: Typecheck (server)
        run: npm --prefix server run typecheck

      - name: Build frontend
        run: npx vite build
        env:
          VITE_TEST_MODE: 'true'

      - name: Build server
        run: npm --prefix server run build

      - name: Audit dependencies
        continue-on-error: true
        run: |
          npm audit --audit-level=critical || true
          npm --prefix server audit --audit-level=critical || true

  # ============================================
  # Job 2: Unit Tests (needs Job 1)
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Run server unit tests
        run: npm --prefix server run test

  # ============================================
  # Job 3: Deploy Production (needs Job 2, push to main only)
  # No staging — single environment, direct deploy
  # ============================================
  deploy-production:
    name: "Deploy Production"
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://ai.agentin.chat
    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 8m
          script_stop: true
          script: |
            set -e
            cd ~/GeekSpace2.0

            echo "=== Pulling latest main ==="
            git pull origin main

            echo "=== Building & deploying container ==="
            docker compose up -d --build geekspace

            echo "=== Syncing static files to Caddy ==="
            docker cp geekspace-app:/app/dist/assets/. /srv/assets/
            docker cp geekspace-app:/app/dist/index.html /srv/index.html
            docker cp geekspace-app:/app/dist/office /srv/office 2>/dev/null || true

            echo "=== Health check ==="
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "Production is healthy!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            if ! curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "ERROR: Health check failed"
              docker compose logs --tail 20 geekspace
              exit 1
            fi

            echo "=== Verifying public URL ==="
            if curl -sf https://ai.agentin.chat/api/health > /dev/null 2>&1; then
              echo "Production is live at https://ai.agentin.chat"
            else
              echo "WARNING: Public URL check failed (Caddy may still be propagating)"
            fi

  # ============================================
  # Job 4: Promote Branches (needs Job 3)
  # ============================================
  promote-branches:
    name: "Promote Branches"
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote main to tracking branches
        run: |
          git push origin HEAD:live-production --force
          echo "Branches synced to main."
