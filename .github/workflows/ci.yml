name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Job 1: Static Checks (lint, typecheck, build, audit)
  # ============================================
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Lint changed files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            HEAD="HEAD"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          echo "Comparing $BASE...$HEAD"
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT "$BASE" "$HEAD" -- '*.ts' '*.tsx' '*.js' '*.jsx' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No JS/TS files changed — skipping lint."
            exit 0
          fi

          echo "Linting changed files:"
          echo "$CHANGED_FILES"
          npx eslint --max-warnings=0 $CHANGED_FILES

      - name: Typecheck (root)
        run: npm run typecheck

      - name: Typecheck (server)
        run: npm --prefix server run typecheck

      - name: Build frontend
        run: npm run build
        env:
          VITE_TEST_MODE: 'true'

      - name: Build server
        run: npm --prefix server run build

      - name: Audit root dependencies
        run: npm audit --audit-level=critical

      - name: Audit server dependencies
        run: npm --prefix server audit --audit-level=critical

  # ============================================
  # Job 2: Unit Tests (needs Job 1)
  # ============================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Run server unit tests
        run: npm --prefix server run test

  # ============================================
  # Job 3: E2E Tests (needs Job 1, non-blocking)
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: static-checks
    timeout-minutes: 30
    continue-on-error: true
    env:
      TEST_MODE: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm --prefix server ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build
        env:
          VITE_TEST_MODE: 'true'
          VITE_API_URL: /api

      - name: Build server
        run: npm --prefix server run build

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          API_URL: http://localhost:3001
          VITE_API_TARGET: http://localhost:3001

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ============================================
  # Job 4: Deploy Staging (needs Job 2, push to main only)
  # ============================================
  deploy-staging:
    name: "Deploy Staging"
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: https://staging.agentin.chat
    steps:
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/GeekSpace2.0

            echo "=== Pulling latest main ==="
            git pull origin main

            echo "=== Installing dependencies ==="
            npm ci
            npm --prefix server ci

            echo "=== Building frontend ==="
            npm run build

            echo "=== Building server ==="
            npm --prefix server run build

            echo "=== Deploying staging container ==="
            docker compose up -d --build staging

            echo "=== Health check (staging) ==="
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3002/api/health > /dev/null 2>&1; then
                echo "Staging is healthy!"
                exit 0
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done
            echo "ERROR: Staging health check failed after 60s"
            docker compose logs --tail 30 staging
            exit 1

  # ============================================
  # Job 5: Deploy Production (needs Job 4)
  # Cancel-in-progress: false — never kill a running deploy
  # ============================================
  deploy-production:
    name: "Deploy Production"
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://ai.agentin.chat
    steps:
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/GeekSpace2.0

            echo "=== Syncing static files to Caddy ==="
            find /srv/assets/ -name "index-*" -not -name "*.css" -delete
            cp -r dist/assets/* /srv/assets/
            cp dist/index.html /srv/index.html
            cp -r dist/office /srv/ 2>/dev/null || true

            echo "=== Deploying production container ==="
            docker compose up -d --build geekspace

            echo "=== Health check (production, local) ==="
            for i in $(seq 1 30); do
              if curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
                echo "Production is healthy (local)!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 2
            done

            if ! curl -sf http://localhost:3001/api/health > /dev/null 2>&1; then
              echo "ERROR: Production health check failed — restarting container"
              docker compose restart geekspace
              docker compose logs --tail 30 geekspace
              exit 1
            fi

            echo "=== Verifying public URL ==="
            if curl -sf https://ai.agentin.chat/api/health > /dev/null 2>&1; then
              echo "Production is live at https://ai.agentin.chat"
            else
              echo "WARNING: Public URL check failed (Caddy may still be propagating)"
            fi

  # ============================================
  # Job 6: Promote Branches (needs Job 5)
  # Fast-forward main → staging and main → live-production
  # No branch switching — working tree stays on main
  # ============================================
  promote-branches:
    name: "Promote Branches"
    runs-on: ubuntu-latest
    needs: deploy-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote main to staging and live-production
        run: |
          git push origin HEAD:staging --force
          git push origin HEAD:live-production --force
          echo "All branches synced to main."
