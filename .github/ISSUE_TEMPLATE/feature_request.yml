name: Feature Request
description: Suggest a new feature or improvement for GeekSpace 2.0
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem-description
    attributes:
      label: Problem Description
      description: Describe the problem or limitation you are experiencing.
      placeholder: A clear description of what the problem is. Ex. "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see implemented.
      placeholder: A clear description of what you want to happen.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the application does this feature relate to?
      options:
        - Frontend
        - Backend API
        - AI/LLM Routing
        - Database
        - Docker/Deployment
        - Integrations
        - Portfolio
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Nice to have
        - Should have
        - Must have
    validations:
      required: true

  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or workarounds you have considered.
      placeholder: List any alternatives or workarounds you have tried.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or references about the feature request here.
      placeholder: Any additional information that would help us understand the request.
    validations:
      required: false
