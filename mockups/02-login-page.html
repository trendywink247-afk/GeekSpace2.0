<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeekSpace 2.0 — Login Page (Unified Design)</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================================
     UNIFIED DESIGN TOKENS (same as landing)
     ============================================ */
  :root {
    --ag-bg-deep: #05050A;
    --ag-bg-base: #06061a;
    --ag-bg-surface: rgba(12, 12, 30, 0.6);

    --ag-text-primary: #F1F5F9;
    --ag-text-secondary: #94A3B8;
    --ag-text-muted: #64748B;
    --ag-text-dim: #475569;

    --ag-border-faint: rgba(255, 255, 255, 0.04);
    --ag-border-subtle: rgba(255, 255, 255, 0.06);
    --ag-border-default: rgba(255, 255, 255, 0.08);
    --ag-border-hover: rgba(255, 255, 255, 0.12);
    --ag-border-active: rgba(255, 255, 255, 0.18);

    --ag-surface-1: rgba(255, 255, 255, 0.02);
    --ag-surface-2: rgba(255, 255, 255, 0.04);
    --ag-surface-3: rgba(255, 255, 255, 0.06);
    --ag-surface-4: rgba(255, 255, 255, 0.08);
    --ag-surface-5: rgba(255, 255, 255, 0.12);

    --ag-violet: #8B5CF6;
    --ag-cyan: #00F0FF;
    --ag-green: #10B981;
    --ag-amber: #F59E0B;
    --ag-pink: #FF2D78;

    --ag-cta-from: #8B5CF6;
    --ag-cta-to: #F59E0B;
    --ag-cta-gradient: linear-gradient(135deg, var(--ag-cta-from), var(--ag-cta-to));

    --ag-glass-bg: rgba(12, 12, 30, 0.4);
    --ag-glass-blur: 20px;

    --ag-radius-sm: 8px;
    --ag-radius-md: 12px;
    --ag-radius-lg: 16px;
    --ag-radius-xl: 24px;

    --ag-transition-smooth: 300ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--ag-bg-base);
    color: var(--ag-text-primary);
    min-height: 100vh;
  }
  h1, h2, h3, h4, h5, h6 { font-family: 'Syne', sans-serif; }

  /* ---- AURORA BACKGROUND ---- */
  .aurora-bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 60%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
      radial-gradient(ellipse at 50% 90%, rgba(245, 158, 11, 0.04) 0%, transparent 50%);
  }
  .noise-overlay {
    position: fixed; inset: 0; z-index: 0; opacity: 0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  }

  /* ---- LAYOUT ---- */
  .login-container {
    position: relative; z-index: 1;
    display: flex; min-height: 100vh;
  }

  /* Left panel — Agent scene */
  .left-panel {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px;
  }
  @media (max-width: 768px) { .left-panel { display: none; } }

  .scene-brand {
    font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 700;
    margin-bottom: 12px;
  }
  .scene-brand .violet { color: var(--ag-violet); }
  .scene-headline {
    font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800;
    margin-bottom: 40px;
  }
  .scene-headline .violet { color: var(--ag-violet); }

  /* Agent constellation scene */
  .agent-scene {
    width: 360px; height: 280px; position: relative;
  }
  .scene-agent {
    position: absolute; display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .scene-agent-orb {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: #fff;
    box-shadow: 0 0 20px var(--glow);
    animation: float 5s ease-in-out infinite;
  }
  .scene-agent-name {
    font-size: 11px; color: var(--ag-text-secondary);
    font-family: 'JetBrains Mono', monospace;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .scene-agent:nth-child(2) .scene-agent-orb { animation-delay: -1s; }
  .scene-agent:nth-child(3) .scene-agent-orb { animation-delay: -2s; }
  .scene-agent:nth-child(4) .scene-agent-orb { animation-delay: -0.5s; }
  .scene-agent:nth-child(5) .scene-agent-orb { animation-delay: -3s; }

  /* Connection lines (SVG) */
  .scene-lines {
    position: absolute; inset: 0; z-index: 0;
  }
  .scene-lines line {
    stroke: rgba(139, 92, 246, 0.15);
    stroke-width: 1; stroke-dasharray: 4 4;
  }

  /* Right panel — Login form */
  .right-panel {
    flex: 1; max-width: 520px; display: flex; align-items: center;
    justify-content: center; padding: 32px 24px;
  }
  @media (max-width: 768px) {
    .right-panel { max-width: 100%; padding: 80px 20px 40px; }
  }

  .form-container { width: 100%; max-width: 400px; }

  .form-title {
    font-size: 28px; font-weight: 700; margin-bottom: 8px;
  }
  .form-subtitle {
    color: var(--ag-text-muted); font-size: 15px; margin-bottom: 28px;
  }

  /* ---- OAUTH BUTTONS ---- */
  .oauth-btn {
    width: 100%; height: 44px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--ag-surface-2);
    border: 1px solid var(--ag-border-default);
    border-radius: var(--ag-radius-md);
    color: var(--ag-text-primary);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all var(--ag-transition-smooth);
    margin-bottom: 10px;
  }
  .oauth-btn:hover {
    background: rgba(139, 92, 246, 0.08);
    border-color: rgba(139, 92, 246, 0.3);
  }
  .oauth-btn svg { width: 18px; height: 18px; }

  .divider {
    display: flex; align-items: center; gap: 16px;
    margin: 20px 0; color: var(--ag-text-muted); font-size: 13px;
  }
  .divider::before, .divider::after {
    content: ''; flex: 1; height: 1px;
    background: var(--ag-border-subtle);
  }

  /* ---- FORM INPUTS ---- */
  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block; font-size: 13px; font-weight: 500;
    color: var(--ag-text-secondary); margin-bottom: 6px;
  }
  .input-wrapper {
    position: relative;
  }
  .input-wrapper .icon-left {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    color: var(--ag-text-muted); font-size: 16px;
  }
  .input-wrapper .icon-right {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--ag-text-muted); font-size: 14px; cursor: pointer;
    background: none; border: none;
  }
  .input-wrapper .icon-right:hover { color: var(--ag-text-secondary); }

  .form-input {
    width: 100%; height: 44px;
    background: rgba(6, 6, 26, 0.6);
    border: 1px solid var(--ag-border-default);
    border-radius: var(--ag-radius-md);
    padding: 0 14px 0 40px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px; color: var(--ag-text-primary);
    transition: all var(--ag-transition-smooth);
    outline: none;
  }
  .form-input::placeholder { color: var(--ag-text-muted); }
  .form-input:focus {
    border-color: rgba(139, 92, 246, 0.5);
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
  }
  .form-input.valid {
    border-color: rgba(16, 185, 129, 0.4);
  }
  .form-input.error {
    border-color: rgba(239, 68, 68, 0.6);
  }

  .input-hint {
    font-size: 12px; margin-top: 6px; color: var(--ag-text-muted);
  }
  .input-hint .url { color: var(--ag-violet); }

  .forgot-link {
    display: block; text-align: right; font-size: 13px;
    color: var(--ag-violet); text-decoration: none; margin-top: 4px;
  }
  .forgot-link:hover { text-decoration: underline; }

  /* ---- PASSWORD STRENGTH ---- */
  .strength-bar {
    height: 3px; border-radius: 2px; margin-top: 8px;
    background: var(--ag-surface-3);
    overflow: hidden;
  }
  .strength-fill {
    height: 100%; border-radius: 2px; transition: width 0.3s;
  }
  .strength-label {
    font-size: 11px; margin-top: 4px;
  }

  /* ---- SUBMIT BUTTON ---- */
  .btn-submit {
    width: 100%; height: 48px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--ag-cta-gradient);
    color: #fff; border: none;
    border-radius: var(--ag-radius-xl);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
    margin-top: 24px;
  }
  .btn-submit:hover {
    box-shadow: 0 0 30px rgba(139, 92, 246, 0.25);
    transform: scale(1.01);
  }

  .btn-demo {
    width: 100%; height: 44px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: transparent;
    color: var(--ag-amber);
    border: 1px solid rgba(245, 158, 11, 0.3);
    border-radius: var(--ag-radius-md);
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px; font-weight: 500;
    cursor: pointer; transition: all var(--ag-transition-smooth);
    margin-top: 12px;
  }
  .btn-demo:hover {
    background: rgba(245, 158, 11, 0.05);
    border-color: rgba(245, 158, 11, 0.5);
  }
  .btn-demo .sub { font-size: 11px; color: var(--ag-text-muted); }

  /* ---- TOGGLE & TRUST ---- */
  .toggle-row {
    text-align: center; margin-top: 24px; font-size: 14px;
    color: var(--ag-text-muted);
  }
  .toggle-row a { color: var(--ag-violet); text-decoration: none; font-weight: 500; }
  .toggle-row a:hover { text-decoration: underline; }

  .trust-badges {
    display: flex; justify-content: center; gap: 24px;
    margin-top: 32px; padding-top: 20px;
    border-top: 1px solid var(--ag-border-faint);
  }
  .trust-badge {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--ag-text-muted);
  }
  .trust-badge svg {
    width: 14px; height: 14px; color: var(--ag-text-muted);
  }
</style>
</head>
<body>

<div class="aurora-bg"></div>
<div class="noise-overlay"></div>

<div class="login-container">

  <!-- LEFT PANEL — Agent Scene -->
  <div class="left-panel">
    <div class="scene-brand">Agent<span class="violet">in</span></div>
    <h2 class="scene-headline"><span class="violet">Your AI.</span> Your Rules.</h2>

    <div class="agent-scene">
      <!-- Connection lines -->
      <svg class="scene-lines" viewBox="0 0 360 280">
        <line x1="180" y1="140" x2="60" y2="50"/>
        <line x1="180" y1="140" x2="300" y2="50"/>
        <line x1="180" y1="140" x2="40" y2="220"/>
        <line x1="180" y1="140" x2="310" y2="220"/>
        <line x1="60" y1="50" x2="300" y2="50"/>
        <line x1="40" y1="220" x2="310" y2="220"/>
      </svg>
      <!-- Center: Weebo -->
      <div class="scene-agent" style="left: 156px; top: 105px; z-index: 2;">
        <div class="scene-agent-orb" style="background: #00F0FF; --glow: rgba(0,240,255,0.3);">W</div>
        <span class="scene-agent-name">Weebo</span>
      </div>
      <!-- Edith -->
      <div class="scene-agent" style="left: 36px; top: 15px;">
        <div class="scene-agent-orb" style="background: #8B5CF6; --glow: rgba(139,92,246,0.3);">E</div>
        <span class="scene-agent-name">Edith</span>
      </div>
      <!-- Jarvis -->
      <div class="scene-agent" style="left: 276px; top: 15px;">
        <div class="scene-agent-orb" style="background: #ADFF2F; --glow: rgba(173,255,47,0.3);">J</div>
        <span class="scene-agent-name">Jarvis</span>
      </div>
      <!-- Aria -->
      <div class="scene-agent" style="left: 16px; top: 185px;">
        <div class="scene-agent-orb" style="background: #FF6B9D; --glow: rgba(255,107,157,0.3);">A</div>
        <span class="scene-agent-name">Aria</span>
      </div>
      <!-- Forge -->
      <div class="scene-agent" style="left: 286px; top: 185px;">
        <div class="scene-agent-orb" style="background: #F59E0B; --glow: rgba(245,158,11,0.3);">F</div>
        <span class="scene-agent-name">Forge</span>
      </div>
    </div>
  </div>

  <!-- RIGHT PANEL — Login Form -->
  <div class="right-panel">
    <div class="form-container">
      <h1 class="form-title">Welcome back</h1>
      <p class="form-subtitle">Sign in to your AI command center</p>

      <!-- OAuth -->
      <button class="oauth-btn">
        <svg viewBox="0 0 24 24" fill="none"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Continue with Google
      </button>
      <button class="oauth-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        Continue with GitHub
      </button>

      <div class="divider">or use email</div>

      <!-- Email -->
      <div class="form-group">
        <label class="form-label">Email</label>
        <div class="input-wrapper">
          <span class="icon-left">&#9993;</span>
          <input type="email" class="form-input" placeholder="you@example.com" value="rahul@example.com">
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrapper">
          <span class="icon-left">&#128274;</span>
          <input type="password" class="form-input" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" value="password123">
          <button class="icon-right" title="Toggle password">&#128065;</button>
        </div>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button class="btn-submit">Sign In &rarr;</button>

      <!-- Demo -->
      <button class="btn-demo">
        &#9889; Try Demo <span class="sub">(no signup needed)</span>
      </button>

      <!-- Toggle -->
      <div class="toggle-row">
        Don't have an account? <a href="#">Sign Up</a>
      </div>

      <!-- Trust badges -->
      <div class="trust-badges">
        <div class="trust-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          End-to-end encrypted
        </div>
        <div class="trust-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
          Self-hosted
        </div>
        <div class="trust-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line x1="1" y1="1" x2="23" y2="23" stroke-width="2"/></svg>
          No tracking
        </div>
      </div>
    </div>
  </div>

</div>

</body>
</html>
